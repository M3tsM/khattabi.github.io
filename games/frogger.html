<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Super Frogger</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;display:flex;justify-content:center;align-items:center;height:100vh;font-family:'Courier New',monospace;overflow:hidden}
canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ===== AUDIO =====
var audioCtx=null;
function initAudio(){if(!audioCtx)try{audioCtx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}
function snd(f,d,t,v){if(!audioCtx)return;try{var o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=t||'square';o.frequency.value=f;g.gain.value=v||0.08;g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+d);o.connect(g);g.connect(audioCtx.destination);o.start(audioCtx.currentTime);o.stop(audioCtx.currentTime+d)}catch(e){}}
function sndHop(){snd(500,0.04,'sine',0.06)}
function sndSplash(){snd(120,0.25,'sawtooth',0.1);snd(80,0.3,'sine',0.06)}
function sndSquish(){snd(80,0.15,'sawtooth',0.12);snd(150,0.1,'square',0.06)}
function sndHome(){snd(600,0.1,'sine',0.1);setTimeout(function(){snd(800,0.12,'sine',0.1)},80)}
function sndLvlUp(){snd(440,0.12,'square',0.08);setTimeout(function(){snd(660,0.12,'square',0.08)},100);setTimeout(function(){snd(880,0.15,'square',0.1)},200)}
function sndTick(){snd(800,0.03,'sine',0.05)}
function sndPower(){snd(800,0.08,'sine',0.1);setTimeout(function(){snd(1000,0.1,'sine',0.1)},60);setTimeout(function(){snd(1200,0.12,'sine',0.1)},120)}

// ===== CANVAS (landscape 16:9) =====
var c=document.getElementById('c'),ctx=c.getContext('2d');
var W=960,H=540;c.width=W;c.height=H;
function resize(){var s=Math.min(window.innerWidth/W,window.innerHeight/H);c.style.width=(W*s)+'px';c.style.height=(H*s)+'px'}
window.addEventListener('resize',resize);resize();

// ===== CONSTANTS =====
var HUD_H=28,ROWS=13,CELL_H=39,CELL_W=80,FROG_S=32;
function rowY(r){return HUD_H+r*CELL_H}
var HOME_X=[160,320,480,640,800],HOME_W=65;

// ===== SPRITE SYSTEM =====
function mkC(w,h){var cv=document.createElement('canvas');cv.width=w;cv.height=h;return cv}
function darkenC(hex,f){var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return'rgb('+~~(r*f)+','+~~(g*f)+','+~~(b*f)+')'}

function mkCar(color,w,dir){
  var h=CELL_H,cv=mkC(w,h),g=cv.getContext('2d');
  g.fillStyle=color;g.fillRect(3,7,w-6,h-14);
  g.fillStyle=darkenC(color,0.7);g.fillRect(5,9,w-10,h-18);
  g.fillStyle='rgba(150,200,255,0.6)';g.fillRect(dir>0?w-16:8,11,10,h-22);
  g.fillStyle='#111';g.fillRect(6,4,7,3);g.fillRect(w-13,4,7,3);g.fillRect(6,h-7,7,3);g.fillRect(w-13,h-7,7,3);
  g.fillStyle='#ff0';var hlx=dir>0?w-5:2;g.fillRect(hlx,12,3,3);g.fillRect(hlx,h-15,3,3);
  g.fillStyle='#fff';g.fillRect(dir>0?w-14:10,13,4,4);g.fillRect((dir>0?w-14:10)+6,13,4,4);
  g.fillStyle='#000';g.fillRect((dir>0?w-13:11)+(dir>0?1:0),14,2,2);g.fillRect((dir>0?w-13:11)+6+(dir>0?1:0),14,2,2);
  return cv;
}

function mkTruck(color,w,dir){
  var h=CELL_H,cv=mkC(w,h),g=cv.getContext('2d');
  var cabX=dir>0?w-22:0;
  g.fillStyle=color;g.fillRect(cabX,5,22,h-10);
  g.fillStyle=darkenC(color,0.75);g.fillRect(dir>0?2:22,4,w-26,h-8);
  g.fillStyle='rgba(150,200,255,0.6)';g.fillRect(cabX+4,9,14,h-18);
  g.fillStyle='#111';g.fillRect(5,2,8,3);g.fillRect(w-13,2,8,3);g.fillRect(5,h-5,8,3);g.fillRect(w-13,h-5,8,3);
  g.fillStyle='#fff';g.fillRect(cabX+5,11,4,4);g.fillRect(cabX+11,11,4,4);
  g.fillStyle='#000';g.fillRect(cabX+6+(dir>0?1:0),12,2,2);g.fillRect(cabX+12+(dir>0?1:0),12,2,2);
  return cv;
}

function mkLog(w){
  var h=CELL_H,cv=mkC(w,h),g=cv.getContext('2d');
  g.fillStyle='#7B4A1A';g.fillRect(0,7,w,h-14);
  g.fillStyle='#9B6A3A';g.fillRect(2,9,w-4,h-18);
  g.fillStyle='rgba(0,0,0,0.12)';for(var lx=12;lx<w-8;lx+=16)g.fillRect(lx,10,1,h-20);
  g.fillStyle='#6B3A0A';g.fillRect(0,7,3,h-14);g.fillRect(w-3,7,3,h-14);
  return cv;
}

function mkTurtle(w,dir){
  var h=CELL_H,cv=mkC(w,h),g=cv.getContext('2d');
  var tw=28,tg=6,count=Math.floor((w-4)/(tw+tg));
  if(count<3)count=3;
  var total=count*tw+(count-1)*tg,startX=Math.floor((w-total)/2);
  for(var ti=0;ti<count;ti++){
    var tx=startX+ti*(tw+tg);
    g.fillStyle='#1a7733';g.fillRect(tx+1,8,tw-2,h-16);
    g.fillStyle='#22993e';g.fillRect(tx+3,10,tw-6,h-20);
    g.fillStyle='#146628';g.fillRect(tx+tw/2-1,10,2,h-20);g.fillRect(tx+3,h/2-1,tw-6,2);
    g.fillStyle='#33bb55';var hx=dir>0?tx+tw-1:tx-4;g.fillRect(hx,h/2-3,5,6);
    g.fillStyle='#fff';g.fillRect(hx+(dir>0?1:0),h/2-2,2,2);
    g.fillStyle='#000';g.fillRect(hx+(dir>0?2:0),h/2-1,1,1);
  }
  return cv;
}

// Crocodile sprite: green body with snapping head
function mkCroc(w,dir,open){
  var h=CELL_H,cv=mkC(w,h),g=cv.getContext('2d');
  var headW=26,bodyStart=dir>0?0:headW,bodyW=w-headW;
  // Body
  g.fillStyle='#2a7a2a';g.fillRect(bodyStart,7,bodyW,h-14);
  g.fillStyle='#3a9a3a';g.fillRect(bodyStart+2,9,bodyW-4,h-18);
  g.fillStyle='rgba(0,0,0,0.12)';
  for(var lx=bodyStart+8;lx<bodyStart+bodyW-4;lx+=10)g.fillRect(lx,10,2,h-20);
  // Spine ridge
  g.fillStyle='#1a6a1a';g.fillRect(bodyStart+4,7,bodyW-8,3);
  // Tail taper
  var tailX=dir>0?0:w-6;
  g.fillStyle='#2a7a2a';g.fillRect(tailX,h/2-3,6,6);g.fillStyle='#1a5a1a';g.fillRect(tailX,h/2-1,4,2);
  // Head
  var hx=dir>0?w-headW:0;
  g.fillStyle='#1a6a1a';g.fillRect(hx,5,headW,h-10);
  g.fillStyle='#228822';g.fillRect(hx+2,7,headW-4,h-14);
  // Eyes on top
  g.fillStyle='#ffcc00';g.fillRect(hx+(dir>0?4:headW-10),6,5,5);g.fillRect(hx+(dir>0?14:headW-20),6,5,5);
  g.fillStyle='#000';g.fillRect(hx+(dir>0?5:headW-9),7,3,3);g.fillRect(hx+(dir>0?15:headW-19),7,3,3);
  if(open){
    // Open mouth — red with teeth
    var mx=dir>0?w-6:0;
    g.fillStyle='#cc2222';g.fillRect(mx,h/2-6,6,12);
    g.fillStyle='#fff';
    for(var t=0;t<3;t++){g.fillRect(mx+(dir>0?0:4),h/2-5+t*4,2,2);g.fillRect(mx+(dir>0?0:4),h/2-3+t*4,2,2)}
  }else{
    // Closed mouth — nostrils
    var nx=dir>0?w-4:2;
    g.fillStyle='#0a4a0a';g.fillRect(nx,h/2-3,2,2);g.fillRect(nx,h/2+1,2,2);
  }
  return cv;
}

// Snake sprite
function mkSnake(len,dir){
  var h=CELL_H,cv=mkC(len+6,h),g=cv.getContext('2d'),cy=Math.floor(h/2);
  var bx=dir>0?0:14,bw=len-14;
  // Body
  g.fillStyle='#8B2222';g.fillRect(bx,cy-5,bw,10);
  g.fillStyle='#CC4444';g.fillRect(bx+1,cy-4,bw-2,8);
  // Diamond pattern
  g.fillStyle='#661111';
  for(var sx=bx+5;sx<bx+bw-4;sx+=12)g.fillRect(sx,cy-3,6,6);
  // Head
  var hdx=dir>0?len-14:0;
  g.fillStyle='#991111';g.fillRect(hdx,cy-7,14,14);
  g.fillStyle='#BB3333';g.fillRect(hdx+2,cy-5,10,10);
  // Eye
  g.fillStyle='#ffcc00';g.fillRect(hdx+(dir>0?7:3),cy-5,4,4);
  g.fillStyle='#000';g.fillRect(hdx+(dir>0?8:4),cy-4,2,2);
  // Tongue
  g.fillStyle='#ff3333';g.fillRect(dir>0?len:0,cy-1,5,2);
  // Tail
  var tx=dir>0?0:len-3;
  g.fillStyle='#8B2222';g.fillRect(tx,cy-2,4,4);g.fillStyle='#661111';g.fillRect(tx,cy-1,3,2);
  return cv;
}

// Powerup sprites
function mkPw(type){
  var cv=mkC(28,28),g=cv.getContext('2d');
  var cols={shield:'#4488ff',time:'#44dd44',life:'#ff4444',slow:'#ffcc00'};
  var dark={shield:'#2255aa',time:'#229922',life:'#aa2222',slow:'#aa8800'};
  g.fillStyle=cols[type];g.fillRect(2,2,24,24);
  g.fillStyle=dark[type];g.fillRect(2,2,24,2);g.fillRect(2,24,24,2);g.fillRect(2,2,2,24);g.fillRect(24,2,2,24);
  g.fillStyle='rgba(255,255,255,0.25)';g.fillRect(4,4,20,10);
  g.fillStyle='#fff';
  if(type==='shield'){
    g.fillRect(10,6,8,2);g.fillRect(8,8,12,8);g.fillRect(10,16,8,3);g.fillRect(12,19,4,2);
  }else if(type==='time'){
    g.fillRect(12,6,4,16);g.fillRect(6,12,16,4);
  }else if(type==='life'){
    g.fillRect(7,8,5,5);g.fillRect(16,8,5,5);g.fillRect(6,10,16,5);g.fillRect(8,15,12,3);g.fillRect(10,18,8,2);g.fillRect(12,20,4,1);
  }else{
    g.fillRect(14,5,5,5);g.fillRect(10,10,8,3);g.fillRect(7,13,8,3);g.fillRect(9,16,8,3);g.fillRect(9,19,5,4);
  }
  return cv;
}

function mkFrog(dir,hop){
  var cv=mkC(44,44),g=cv.getContext('2d'),cx=22,cy=22;
  g.fillStyle='#2a9a2a';g.fillRect(cx-14,cy-12,28,24);
  g.fillStyle='#33bb33';g.fillRect(cx-12,cy-10,24,20);
  g.fillStyle='#55dd55';g.fillRect(cx-7,cy-2,14,12);
  g.fillStyle='#fff';g.fillRect(cx-11,cy-15,9,9);g.fillRect(cx+2,cy-15,9,9);
  g.fillStyle='#000';
  var px=0,py=0;
  if(dir===0)py=-1;else if(dir===1)px=1;else if(dir===2)py=1;else px=-1;
  g.fillRect(cx-9+px*2,cy-13+py*2,3,3);g.fillRect(cx+5+px*2,cy-13+py*2,3,3);
  g.fillStyle='#228822';
  var ls=hop?4:0;
  if(dir===0||dir===2){
    g.fillRect(cx-18,cy-7-ls,6,6);g.fillRect(cx+12,cy-7-ls,6,6);
    g.fillRect(cx-18,cy+3+ls,6,6);g.fillRect(cx+12,cy+3+ls,6,6);
  }else{
    g.fillRect(cx-8,cy-18-ls,6,6);g.fillRect(cx+2,cy-18-ls,6,6);
    g.fillRect(cx-8,cy+12+ls,6,6);g.fillRect(cx+2,cy+12+ls,6,6);
  }
  g.fillStyle='#44cc44';
  if(dir===0||dir===2){g.fillRect(cx-19,cy-7-ls,2,2);g.fillRect(cx+17,cy-7-ls,2,2)}
  g.fillStyle='#1a7a1a';g.fillRect(cx-5,cy+6,10,2);
  return cv;
}

var miniFrogSprite=(function(){
  var cv=mkC(12,12),g=cv.getContext('2d');
  g.fillStyle='#33bb33';g.fillRect(1,2,10,8);
  g.fillStyle='#fff';g.fillRect(2,0,3,3);g.fillRect(7,0,3,3);
  g.fillStyle='#000';g.fillRect(3,1,1,1);g.fillRect(8,1,1,1);
  return cv;
})();

// Pre-render static background
var bgCanvas=null;
function mkBg(){
  bgCanvas=mkC(W,H);
  var g=bgCanvas.getContext('2d');
  g.fillStyle='#111';g.fillRect(0,0,W,H);
  for(var r=0;r<ROWS;r++){
    var y=rowY(r);
    if(r===0){
      g.fillStyle='#143d14';g.fillRect(0,y,W,CELL_H);
      g.fillStyle='#1a5276';
      g.fillRect(0,y+5,HOME_X[0]-HOME_W/2,CELL_H-10);
      for(var i=0;i<4;i++)g.fillRect(HOME_X[i]+HOME_W/2,y+5,HOME_X[i+1]-HOME_X[i]-HOME_W,CELL_H-10);
      g.fillRect(HOME_X[4]+HOME_W/2,y+5,W,CELL_H-10);
    }
    else if(r>=1&&r<=5){g.fillStyle='#1a5276';g.fillRect(0,y,W,CELL_H)}
    else if(r===6){g.fillStyle='#2d6b2d';g.fillRect(0,y,W,CELL_H);g.fillStyle='#3a8a3a';g.fillRect(0,y,W,3);g.fillRect(0,y+CELL_H-3,W,3)}
    else if(r>=7&&r<=11){
      g.fillStyle='#2a2a2a';g.fillRect(0,y,W,CELL_H);
      g.fillStyle='#444';for(var dx=((r%2)*20);dx<W;dx+=40)g.fillRect(dx,y+CELL_H/2-1,20,1);
    }
    else if(r===12){g.fillStyle='#2d6b2d';g.fillRect(0,y,W,CELL_H);g.fillStyle='#3a8a3a';g.fillRect(0,y,W,3)}
  }
  g.fillStyle='#888';g.fillRect(0,rowY(7)-1,W,2);g.fillRect(0,rowY(12)-1,W,2);
}
mkBg();

// Sprite cache
var spriteCache={};
function getSprite(type,color,w,dir,extra){
  var k=type+'_'+(color||'')+'_'+w+'_'+dir+(extra?'_'+extra:'');
  if(!spriteCache[k]){
    if(type==='car')spriteCache[k]=mkCar(color,w,dir);
    else if(type==='truck')spriteCache[k]=mkTruck(color,w,dir);
    else if(type==='log')spriteCache[k]=mkLog(w);
    else if(type==='turtle')spriteCache[k]=mkTurtle(w,dir);
    else if(type==='croc')spriteCache[k]=mkCroc(w,dir,extra==='open');
  }
  return spriteCache[k];
}

var frogSprites=[];
for(var d=0;d<4;d++){frogSprites.push(mkFrog(d,false));frogSprites.push(mkFrog(d,true))}

// Powerup sprite cache
var pwSprites={};
var pwTypes=['shield','time','life','slow'];
for(var pi=0;pi<4;pi++)pwSprites[pwTypes[pi]]=mkPw(pwTypes[pi]);

// Snake sprite cache
var snakeSprCache={};
function getSnakeSpr(len,dir){var k=len+'_'+dir;if(!snakeSprCache[k])snakeSprCache[k]=mkSnake(len,dir);return snakeSprCache[k]}

// ===== STATE =====
var ST_TITLE=0,ST_PLAY=1,ST_DEAD=2,ST_LVLUP=3,ST_OVER=4;
var state=ST_TITLE,score=0,lives=5,level=1;
var highScore=parseInt(localStorage.getItem('sfrog_hi2')||'0');
var frogX,frogY,frogRow,frogDir=0,hopAnim=0;
var furthestRow,timer,maxTimer=3600;
var homeSlots,lanes=[],tick=0,deathTimer=0,deathType='';
var particles=[];

// Powerup state
var powerups=[];
var pwSpawnCD=0;
var hasShield=false;
var slowTimer=0;

// Snake state
var snakes=[];

// ===== LEVEL CONFIGS =====
// Road lane configs per level tier: [type, speedMul, color, width, baseGap]
var roadCfg=[
  // Tier 0 (lvl 1-2): standard
  [{t:'car',s:1.0,c:'#ffcc00',w:80,g:240},{t:'truck',s:0.6,c:'#3366cc',w:140,g:280},{t:'car',s:1.4,c:'#ff4444',w:80,g:200},{t:'truck',s:0.5,c:'#44aa44',w:155,g:300},{t:'car',s:1.1,c:'#cc44cc',w:80,g:220}],
  // Tier 1 (lvl 3-4): fast small cars
  [{t:'car',s:1.8,c:'#ff8800',w:60,g:180},{t:'truck',s:0.7,c:'#3366cc',w:140,g:260},{t:'car',s:1.2,c:'#ff4444',w:80,g:200},{t:'car',s:1.6,c:'#ffcc00',w:60,g:170},{t:'truck',s:0.7,c:'#8844aa',w:155,g:280}],
  // Tier 2 (lvl 5-6): wide trucks + zippy cars
  [{t:'car',s:1.6,c:'#ff4444',w:60,g:170},{t:'truck',s:0.4,c:'#2255aa',w:200,g:330},{t:'car',s:2.0,c:'#ff8800',w:55,g:160},{t:'truck',s:0.5,c:'#44aa44',w:155,g:280},{t:'car',s:1.3,c:'#cc44cc',w:80,g:200}],
  // Tier 3 (lvl 7+): chaos
  [{t:'car',s:2.0,c:'#ff2200',w:55,g:150},{t:'car',s:1.5,c:'#ffcc00',w:70,g:170},{t:'truck',s:0.8,c:'#4466dd',w:160,g:260},{t:'car',s:2.2,c:'#ff8800',w:50,g:140},{t:'truck',s:0.6,c:'#aa44aa',w:180,g:300}]
];
// Water lane configs per level tier
var waterCfg=[
  // Tier 0 (lvl 1-2): logs + turtles
  [{t:'turtle',s:0.8,w:155,g:180},{t:'log',s:0.6,w:220,g:160},{t:'log',s:1.1,w:120,g:140},{t:'turtle',s:0.9,w:155,g:180},{t:'log',s:0.5,w:240,g:180}],
  // Tier 1 (lvl 3-4): crocs appear
  [{t:'turtle',s:0.8,w:155,g:170},{t:'log',s:0.7,w:200,g:150},{t:'croc',s:0.9,w:160,g:200},{t:'turtle',s:1.0,w:155,g:170},{t:'log',s:0.5,w:220,g:170}],
  // Tier 2 (lvl 5-6): more crocs, smaller platforms
  [{t:'croc',s:0.9,w:150,g:200},{t:'log',s:0.7,w:180,g:150},{t:'log',s:1.3,w:100,g:130},{t:'croc',s:1.0,w:150,g:200},{t:'turtle',s:0.8,w:155,g:170}],
  // Tier 3 (lvl 7+): max variety
  [{t:'croc',s:1.1,w:140,g:190},{t:'turtle',s:0.9,w:155,g:160},{t:'log',s:1.4,w:90,g:120},{t:'croc',s:1.0,w:140,g:190},{t:'log',s:0.6,w:200,g:160}]
];

// ===== LANE SETUP =====
function buildLanes(){
  lanes=[];spriteCache={};
  var spd=Math.min(3.5,1.3+level*0.18);
  var tier=level<=2?0:level<=4?1:level<=6?2:3;
  var rc=roadCfg[tier],wc=waterCfg[tier];
  var gapShrink=(level-1)*4;

  for(var r=0;r<ROWS;r++){
    var lane={row:r,y:rowY(r),objects:[],speed:0,dir:1,type:'safe',color:'',objW:80,
      canDive:false,divePhase:0,diving:false,canBite:false,mouthPhase:0,mouthOpen:false};
    if(r===0||r===6||r===12){lanes.push(lane);continue}

    if(r>=7&&r<=11){
      var ri=r-7,cfg=rc[ri];
      lane.dir=ri%2===0?1:-1;
      lane.type=cfg.t;lane.speed=spd*cfg.s;lane.color=cfg.c;lane.objW=cfg.w;
      lane.gap=Math.max(90,cfg.g-gapShrink);
      for(var x=0;x<W+300;x+=lane.objW+lane.gap)lane.objects.push({x:x});
      getSprite(lane.type,lane.color,lane.objW,lane.dir);
    }else if(r>=1&&r<=5){
      var wi=r-1,cfg=wc[wi];
      lane.dir=wi%2===0?-1:1;
      lane.type=cfg.t;lane.speed=spd*cfg.s;lane.objW=cfg.w;
      lane.gap=Math.max(70,cfg.g-gapShrink);

      if(cfg.t==='turtle'){
        // First turtle in tier can dive at lvl>=2, second at lvl>=3
        var tIdx=0;for(var tw=0;tw<wi;tw++)if(wc[tw].t==='turtle')tIdx++;
        lane.canDive=tIdx===0?level>=2:level>=3;
      }
      if(cfg.t==='croc'){
        lane.canBite=true;
        lane.mouthPhase=Math.floor(Math.random()*100);
      }

      for(var x=0;x<W+350;x+=lane.objW+lane.gap)lane.objects.push({x:x});
      // Pre-warm sprites
      if(cfg.t==='croc'){getSprite('croc','',lane.objW,lane.dir,'open');getSprite('croc','',lane.objW,lane.dir,'closed')}
      else{getSprite(lane.type,lane.color,lane.objW,lane.dir)}
    }
    lanes.push(lane);
  }
}

function setupSnakes(){
  snakes=[];snakeSprCache={};
  if(level>=4)snakes.push({x:W*0.25,dir:1,speed:1.2+level*0.1,len:80,row:6});
  if(level>=6)snakes.push({x:W*0.7,dir:-1,speed:1.0+level*0.12,len:90,row:6});
  if(level>=8)snakes.push({x:W*0.5,dir:1,speed:1.4+level*0.08,len:70,row:6});
  // Pre-warm snake sprites
  for(var i=0;i<snakes.length;i++){getSnakeSpr(snakes[i].len,1);getSnakeSpr(snakes[i].len,-1)}
}

// ===== GAME INIT =====
function startGame(){score=0;lives=5;level=1;hasShield=false;slowTimer=0;startLevel()}
function startLevel(){
  frogX=W/2;frogRow=12;frogY=rowY(12)+CELL_H/2;frogDir=0;hopAnim=0;
  furthestRow=12;timer=maxTimer;homeSlots=[false,false,false,false,false];
  particles=[];deathTimer=0;powerups=[];pwSpawnCD=0;
  buildLanes();setupSnakes();state=ST_PLAY;
}
function resetFrog(){
  frogX=W/2;frogRow=12;frogY=rowY(12)+CELL_H/2;frogDir=0;hopAnim=0;
  furthestRow=12;timer=maxTimer;deathTimer=0;
}

// ===== INPUT =====
document.addEventListener('keydown',function(e){
  initAudio();
  var k=e.code;
  if(k==='ArrowUp'||k==='ArrowDown'||k==='ArrowLeft'||k==='ArrowRight')e.preventDefault();
  if(state===ST_TITLE){startGame();return}
  if(state===ST_OVER){state=ST_TITLE;return}
  if(state===ST_LVLUP){level++;startLevel();return}
  if(state===ST_PLAY&&hopAnim<=0){
    if(k==='ArrowUp'&&frogRow>0){moveFrog(0,-1);frogDir=0}
    else if(k==='ArrowDown'&&frogRow<12){moveFrog(0,1);frogDir=2}
    else if(k==='ArrowLeft'&&frogX>CELL_W/2+2){moveFrog(-1,0);frogDir=3}
    else if(k==='ArrowRight'&&frogX<W-CELL_W/2-2){moveFrog(1,0);frogDir=1}
  }
});
c.addEventListener('click',function(){initAudio();
  if(state===ST_TITLE)startGame();
  else if(state===ST_OVER)state=ST_TITLE;
  else if(state===ST_LVLUP){level++;startLevel()}
});

function moveFrog(dx,dy){
  sndHop();hopAnim=10;
  frogX+=dx*CELL_W;frogRow+=dy;
  frogY=rowY(frogRow)+CELL_H/2;
  frogX=Math.max(FROG_S/2+2,Math.min(W-FROG_S/2-2,frogX));
  if(frogRow<furthestRow){score+=10*(furthestRow-frogRow);furthestRow=frogRow}
  // Collect powerups
  for(var i=powerups.length-1;i>=0;i--){
    var pw=powerups[i];
    if(frogRow===pw.row&&Math.abs(frogX-pw.x)<30){collectPw(pw);powerups.splice(i,1)}
  }
  if(frogRow===0)checkHome();
}

function collectPw(pw){
  sndPower();score+=50;spawnP(pw.x,pw.y,'#ffffff',8);
  if(pw.type==='shield'){hasShield=true;addFloat(pw.x,pw.y-10,'SHIELD!','#48f')}
  else if(pw.type==='time'){timer=Math.min(timer+600,maxTimer);addFloat(pw.x,pw.y-10,'TIME+','#4f4')}
  else if(pw.type==='life'){lives=Math.min(lives+1,9);addFloat(pw.x,pw.y-10,'+1 UP!','#f44')}
  else if(pw.type==='slow'){slowTimer=360;addFloat(pw.x,pw.y-10,'SLOW!','#fc0')}
}

function checkHome(){
  for(var i=0;i<5;i++){
    if(Math.abs(frogX-HOME_X[i])<HOME_W/2&&!homeSlots[i]){
      homeSlots[i]=true;score+=200+Math.floor(timer/60);
      sndHome();spawnP(HOME_X[i],rowY(0)+CELL_H/2,'#ffff00',6);
      addFloat(HOME_X[i],rowY(0)+10,'HOME!','#ff0');
      var allFull=true;for(var j=0;j<5;j++)if(!homeSlots[j])allFull=false;
      if(allFull){score+=1000;state=ST_LVLUP;sndLvlUp();saveHigh()}
      else resetFrog();
      return;
    }
  }
  killFrog('water');
}

function killFrog(type){
  if(state!==ST_PLAY)return;
  // Shield absorbs one hit
  if(hasShield){
    hasShield=false;
    spawnP(frogX,frogY,'#4488ff',10);addFloat(frogX,frogY-15,'SAVED!','#48f');
    sndPower();return;
  }
  deathType=type;deathTimer=100;state=ST_DEAD;
  if(type==='road'){sndSquish();spawnP(frogX,frogY,'#ff0000',8)}
  else{sndSplash();spawnP(frogX,frogY,'#4488ff',8)}
}

function spawnP(x,y,col,n){if(particles.length>40)return;for(var i=0;i<n;i++){var a=Math.random()*6.28,sp=1+Math.random()*3;particles.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:36+Math.random()*24,ml:60,color:col,size:2+Math.random()*3})}}
function addFloat(x,y,text,col){particles.push({x:x,y:y,vx:0,vy:-0.5,life:90,ml:90,color:col,text:text})}
function saveHigh(){if(score>highScore){highScore=score;localStorage.setItem('sfrog_hi2',''+highScore)}}

// ===== UPDATE =====
function update(){
  tick++;
  // Particles
  var pw=0;for(var i=0;i<particles.length;i++){var p=particles[i];p.x+=p.vx;p.y+=p.vy;if(!p.text)p.vy+=0.03;p.life--;if(p.life>0){particles[pw++]=p}}particles.length=pw;

  if(state===ST_DEAD){deathTimer--;if(deathTimer<=0){lives--;saveHigh();if(lives<=0)state=ST_OVER;else{state=ST_PLAY;resetFrog()}}return}
  if(state!==ST_PLAY)return;
  if(hopAnim>0)hopAnim--;

  timer--;
  if(timer<=0){killFrog('time');return}
  if(timer===360&&tick%2===0)sndTick();
  if(slowTimer>0)slowTimer--;

  var spdMul=slowTimer>0?0.3:1.0;

  // Powerup spawning (level 2+)
  if(level>=2&&powerups.length<2){
    pwSpawnCD++;
    if(pwSpawnCD>480+Math.floor(Math.random()*240)){
      var pt=pwTypes[Math.floor(Math.random()*4)];
      var pr=Math.random()>0.5?6:12;
      // Avoid spawning on snake row if snakes exist and row is 6
      if(pr===6&&snakes.length>0&&Math.random()<0.4)pr=12;
      powerups.push({x:120+Math.random()*(W-240),y:rowY(pr)+CELL_H/2,row:pr,type:pt,life:600});
      pwSpawnCD=0;
    }
  }
  // Decay powerups
  for(var i=powerups.length-1;i>=0;i--){powerups[i].life--;if(powerups[i].life<=0)powerups.splice(i,1)}

  // Update snakes
  for(var si=0;si<snakes.length;si++){
    var s=snakes[si];
    s.x+=s.speed*s.dir*spdMul;
    if(s.x+s.len>W-20){s.dir=-1;s.x=W-20-s.len}
    if(s.x<20){s.dir=1;s.x=20}
  }

  // Update lanes
  for(var r=0;r<ROWS;r++){
    var lane=lanes[r];
    if(lane.type==='safe')continue;
    for(var j=0;j<lane.objects.length;j++){
      var obj=lane.objects[j];obj.x+=lane.speed*lane.dir*spdMul;
      if(lane.dir>0&&obj.x>W+100)obj.x=-lane.objW-100;
      if(lane.dir<0&&obj.x+lane.objW<-100)obj.x=W+100;
    }
    if(lane.canDive){lane.divePhase=(lane.divePhase+1)%(Math.max(400,700-level*16));lane.diving=lane.divePhase>Math.max(320,600-level*16)}
    if(lane.canBite){
      var period=Math.max(240,450-level*15);
      var openAt=Math.max(180,370-level*12);
      lane.mouthPhase=(lane.mouthPhase+1)%period;
      lane.mouthOpen=lane.mouthPhase>openAt;
    }

    // Frog collision on this row
    if(r===frogRow&&hopAnim<=0){
      var fl=frogX-FROG_S/2+3,fr=frogX+FROG_S/2-3;
      if(lane.type==='car'||lane.type==='truck'){
        for(var j=0;j<lane.objects.length;j++){var obj=lane.objects[j];if(fr>obj.x+3&&fl<obj.x+lane.objW-3){killFrog('road');return}}
      }else if(lane.type==='log'||lane.type==='turtle'||lane.type==='croc'){
        if(lane.type==='turtle'&&lane.diving){killFrog('water');return}
        var onObj=false;
        for(var j=0;j<lane.objects.length;j++){
          var obj=lane.objects[j];
          if(fr>obj.x&&fl<obj.x+lane.objW){
            onObj=true;
            // Croc head is deadly when mouth open
            if(lane.type==='croc'&&lane.mouthOpen){
              var hs=26;
              var hl=lane.dir>0?obj.x+lane.objW-hs:obj.x;
              if(frogX>hl&&frogX<hl+hs){killFrog('water');return}
            }
            break;
          }
        }
        if(!onObj){killFrog('water');return}
        frogX+=lane.speed*lane.dir*spdMul;
        if(frogX<FROG_S/2||frogX>W-FROG_S/2){killFrog('water');return}
      }
    }
  }

  // Snake collision
  if(hopAnim<=0){
    for(var si=0;si<snakes.length;si++){
      var s=snakes[si];
      if(frogRow===s.row){
        var fl=frogX-FROG_S/2+3,fr=frogX+FROG_S/2-3;
        if(fr>s.x&&fl<s.x+s.len){killFrog('road');return}
      }
    }
  }
}

// ===== DRAW =====
function draw(){
  if(state===ST_TITLE){drawTitle();return}
  drawGame();
  if(state===ST_OVER)drawOvl('GAME OVER','Score: '+score,'Click or press any key');
  else if(state===ST_LVLUP)drawOvl('LEVEL '+level+' CLEAR!','Score: '+score,'Click or press any key');
}

function drawGame(){
  ctx.drawImage(bgCanvas,0,0);

  // Home slot lily pads
  var hy=rowY(0);
  for(var i=0;i<5;i++){
    ctx.fillStyle=homeSlots[i]?'#1a6622':'#2d8c2d';
    ctx.fillRect(HOME_X[i]-HOME_W/2,hy+3,HOME_W,CELL_H-6);
    ctx.fillStyle=homeSlots[i]?'#228833':'#3ba33b';
    ctx.fillRect(HOME_X[i]-HOME_W/2+3,hy+6,HOME_W-6,CELL_H-12);
    if(homeSlots[i])ctx.drawImage(miniFrogSprite,HOME_X[i]-6,hy+CELL_H/2-6);
  }

  // Lane objects
  for(var r=0;r<ROWS;r++){
    var lane=lanes[r],y=rowY(r);
    if(lane.type==='safe')continue;
    var extra=null;
    if(lane.type==='croc')extra=lane.mouthOpen?'open':'closed';
    var spr=getSprite(lane.type,lane.color,lane.objW,lane.dir,extra);
    for(var j=0;j<lane.objects.length;j++){
      var ox=lane.objects[j].x;
      if(ox+lane.objW<-10||ox>W+10)continue;
      if(lane.type==='turtle'&&lane.diving){ctx.globalAlpha=0.25;ctx.drawImage(spr,ox,y);ctx.globalAlpha=1}
      else ctx.drawImage(spr,ox,y);
    }
  }

  // Snakes
  for(var si=0;si<snakes.length;si++){
    var s=snakes[si];
    ctx.drawImage(getSnakeSpr(s.len,s.dir),s.x,rowY(s.row));
  }

  // Powerups
  for(var i=0;i<powerups.length;i++){
    var pw=powerups[i];
    var bob=Math.sin(tick*0.05+i*2)*4;
    var fade=pw.life<120?(pw.life/120):1;
    // Glow
    var gc={shield:'#4488ff',time:'#44dd44',life:'#ff4444',slow:'#ffcc00'};
    ctx.globalAlpha=fade*0.25+0.1*Math.sin(tick*0.08);
    ctx.fillStyle=gc[pw.type];
    ctx.fillRect(pw.x-18,pw.y-18+bob,36,36);
    ctx.globalAlpha=fade;
    ctx.drawImage(pwSprites[pw.type],pw.x-14,pw.y-14+bob);
    ctx.globalAlpha=1;
  }

  // Frog
  if(state===ST_PLAY||(state===ST_DEAD&&deathTimer>40)){
    var fy=frogY;
    if(hopAnim>0)fy-=Math.sin(hopAnim/10*Math.PI)*8;
    // Shield glow
    if(hasShield&&state===ST_PLAY){
      ctx.globalAlpha=0.2+0.15*Math.sin(tick*0.08);
      ctx.fillStyle='#4488ff';
      ctx.fillRect(frogX-25,fy-25,50,50);
      ctx.globalAlpha=1;
    }
    if(state===ST_DEAD&&deathType==='road'){
      var da=deathTimer/100;
      ctx.globalAlpha=da;ctx.fillStyle='#44cc44';ctx.fillRect(frogX-FROG_S/2-2,fy-3,FROG_S+4,6);
      ctx.fillStyle='#cc0000';ctx.fillRect(frogX-4,fy-3,8,6);ctx.globalAlpha=1;
    }else{
      if(state===ST_DEAD)ctx.globalAlpha=deathTimer/100;
      var fi=frogDir*2+(hopAnim>0?1:0);
      ctx.drawImage(frogSprites[fi],frogX-22,fy-22);
      if(state===ST_DEAD)ctx.globalAlpha=1;
    }
  }

  // Particles
  ctx.font='bold 16px Courier New';ctx.textAlign='center';
  for(var i=0;i<particles.length;i++){var p=particles[i],a=p.life/p.ml;ctx.globalAlpha=a;
    if(p.text){ctx.fillStyle=p.color;ctx.fillText(p.text,p.x,p.y)}
    else{ctx.fillStyle=p.color;ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size)}}
  ctx.globalAlpha=1;

  // Slow-mo tint
  if(slowTimer>0){
    ctx.globalAlpha=0.08;ctx.fillStyle='#ffcc00';ctx.fillRect(0,HUD_H,W,H-HUD_H);ctx.globalAlpha=1;
  }

  // HUD
  ctx.fillStyle='#0a0a0a';ctx.fillRect(0,0,W,HUD_H);
  ctx.fillStyle='#fff';ctx.font='bold 14px Courier New';
  ctx.textAlign='left';ctx.fillText('SCORE: '+score,10,18);
  ctx.textAlign='center';ctx.fillText('LVL '+level,W/2,18);
  ctx.textAlign='right';ctx.fillText('LIVES: '+lives,W-10,18);
  for(var i=0;i<Math.min(lives,8);i++){ctx.fillStyle='#4c4';ctx.fillRect(W-90-i*12,22,8,5)}
  var tp=timer/maxTimer;ctx.fillStyle=tp<0.15?'#f44':tp<0.3?'#fa0':'#4c4';ctx.fillRect(10,24,(W-20)*tp,3);
  ctx.fillStyle='#555';ctx.font='10px Courier New';ctx.textAlign='center';ctx.fillText('HI: '+highScore,W/2,27);
  // Active effects in HUD
  var ex=W/2+50;
  ctx.textAlign='center';ctx.font='bold 10px Courier New';
  if(hasShield){ctx.fillStyle='#4488ff';ctx.fillRect(ex,6,18,18);ctx.fillStyle='#fff';ctx.fillText('S',ex+9,18);ex+=22}
  if(slowTimer>0){ctx.fillStyle='#ffcc00';ctx.fillRect(ex,6,18,18);ctx.fillStyle='#000';ctx.fillText('~',ex+9,18);ex+=22}
  // Snake warning on median
  if(snakes.length>0){ctx.fillStyle='#cc4444';ctx.font='bold 10px Courier New';ctx.textAlign='left';ctx.fillText('SNAKES!',W/2+80,18)}
}

function drawTitle(){
  ctx.fillStyle='#0a1a0a';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#2a2a2a';ctx.fillRect(0,H/2+20,W,60);ctx.fillStyle='#444';
  for(var dx=0;dx<W;dx+=40)ctx.fillRect(dx+((tick*.25)%40),H/2+49,20,1);
  ctx.fillStyle='#1a5276';ctx.fillRect(0,H/2-60,W,50);

  ctx.textAlign='center';
  ctx.fillStyle='#55dd55';ctx.font='bold 24px Courier New';ctx.fillText('SUPER',W/2,H/2-160+Math.sin(tick*.02)*3);
  var title='FROGGER';
  ctx.font='bold 56px Courier New';
  for(var i=0;i<title.length;i++){
    var ox=W/2-((title.length-1)*35)/2+i*35,oy=H/2-125+Math.sin(tick*.025+i*.6)*5;
    var hue=(tick+i*50)%360;
    ctx.fillStyle='hsl('+hue+',70%,55%)';ctx.fillText(title[i],ox,oy);
  }
  ctx.drawImage(frogSprites[0],W/2-22,H/2-90);

  ctx.fillStyle='#ccc';ctx.font='16px Courier New';
  ctx.fillText('Help the frog cross safely!',W/2,H/2-20);
  ctx.fillStyle='#999';ctx.font='14px Courier New';
  ctx.fillText('Arrow Keys / D-Pad to hop',W/2,H/2+5);
  ctx.fillText('Dodge cars, ride logs, watch for crocs!',W/2,H/2+23);
  ctx.fillText('Collect powerups: Shield, Time, Life, Slow',W/2,H/2+41);
  ctx.fillText('Fill all 5 lily pads to win!',W/2,H/2+59);

  if(~~(tick/56)%2===0){ctx.fillStyle='#fa0';ctx.font='bold 20px Courier New';ctx.fillText('PRESS ANY KEY',W/2,H/2+115)}
  ctx.fillStyle='#555';ctx.font='12px Courier New';ctx.fillText('High Score: '+highScore,W/2,H/2+145);
}

function drawOvl(t1,t2,t3){
  ctx.fillStyle='rgba(0,0,0,0.75)';ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.fillStyle=state===ST_OVER?'#f44':'#4c4';ctx.font='bold 36px Courier New';ctx.fillText(t1,W/2,H/2-30);
  ctx.fillStyle='#fa0';ctx.font='22px Courier New';ctx.fillText(t2,W/2,H/2+10);
  ctx.fillStyle='#888';ctx.font='14px Courier New';ctx.fillText('High Score: '+highScore,W/2,H/2+40);
  if(~~(tick/56)%2===0){ctx.fillStyle='#fff';ctx.font='16px Courier New';ctx.fillText(t3,W/2,H/2+75)}
}

// ===== LOOP (60fps) =====
var _lastFrame=0,_frameMs=1000/60;
function loop(ts){if(ts-_lastFrame>=_frameMs){_lastFrame=ts;update();draw()}requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
