<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Galaga</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;display:flex;justify-content:center;align-items:center;height:100vh;font-family:'Courier New',monospace;overflow:hidden}
canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ===== AUDIO =====
var audioCtx=null;
function initAudio(){if(!audioCtx)try{audioCtx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}
function snd(f,d,t,v){if(!audioCtx)return;try{var o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=t||'square';o.frequency.value=f;g.gain.value=v||0.08;g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+d);o.connect(g);g.connect(audioCtx.destination);o.start(audioCtx.currentTime);o.stop(audioCtx.currentTime+d)}catch(e){}}
function sndShoot(){snd(1200,0.06,'square',0.06)}
function sndHit(){snd(200,0.1,'sawtooth',0.1);snd(400,0.08,'square',0.06)}
function sndDeath(){snd(400,0.1,'sawtooth',0.12);snd(200,0.3,'sawtooth',0.1);snd(100,0.5,'square',0.08)}
function sndStageClear(){snd(440,0.12,'square',0.08);setTimeout(function(){snd(550,0.12,'square',0.08)},100);setTimeout(function(){snd(660,0.12,'square',0.08)},200);setTimeout(function(){snd(880,0.2,'square',0.1)},300)}
function sndBossHit(){snd(300,0.08,'triangle',0.1)}
function sndEnemyShoot(){snd(150,0.08,'sawtooth',0.04)}

// ===== CANVAS =====
var c=document.getElementById('c'),ctx=c.getContext('2d');
var W=480,H=640;c.width=W;c.height=H;
function resize(){var s=Math.min(window.innerWidth/W,window.innerHeight/H)*0.95;c.style.width=(W*s)+'px';c.style.height=(H*s)+'px'}
window.addEventListener('resize',resize);resize();

// ===== CONSTANTS =====
var PLAYER_Y=H-50;
var PLAYER_SPEED=4;
var BULLET_SPEED=8;
var MAX_PLAYER_BULLETS=2;
var MAX_ENEMY_BULLETS=10;
var FORM_X=W/2;
var FORM_Y=120;
var FORM_SWAY_SPEED=0.008;
var FORM_SWAY_AMP=30;

// Enemy types
var EN_BEE=0,EN_BUTTERFLY=1,EN_BOSS=2;
var EN_POINTS=[100,160,400];
var EN_COLORS=[['#4488ff','#2266dd'],['#ff4488','#dd2266'],['#44ff44','#22aa22']];

// ===== STATE =====
var ST_TITLE=0,ST_PLAY=1,ST_STAGE_MSG=2,ST_OVER=3,ST_DEATH=4;
var gameState=ST_TITLE;
var score=0,lives=3,stage=1;
var highScore=parseInt(localStorage.getItem('galaga_hi')||'0');
var playerX=W/2;
var playerY=PLAYER_Y;
var playerBullets=[];
var enemyBullets=[];
var enemies=[];
var explosions=[];
var stars=[];
var tick=0;
var keys={};
var shootCooldown=0;
var stageTimer=0;
var deathTimer=0;
var diveTimer=0;
var formSwayAngle=0;
var enemiesAlive=0;

// Dive difficulty scaling
var diveInterval=120;
var diveBulletSpeed=3;
var maxDivers=2;

// ===== STARS =====
for(var i=0;i<20;i++){
  stars.push({x:Math.random()*W,y:Math.random()*H,s:0.5+Math.random()*1.5,b:0.3+Math.random()*0.7});
}

// ===== INPUT =====
var lastKey='none';
document.addEventListener('keydown',function(e){
  keys[e.keyCode]=true;
  lastKey='kC:'+e.keyCode+' code:'+e.code+' key:'+e.key;
  if(e.keyCode===23||e.keyCode===66||e.keyCode===62||e.keyCode===160)keys[32]=true;
  e.preventDefault();
  if(gameState===ST_TITLE){initAudio();startGame();}
  if(gameState===ST_OVER){initAudio();gameState=ST_TITLE;}
});
document.addEventListener('keyup',function(e){keys[e.keyCode]=false;if(e.keyCode===23||e.keyCode===66||e.keyCode===62||e.keyCode===160)keys[32]=false;});

// ===== FORMATION SETUP =====
function createFormation(){
  enemies=[];
  var spacingX=34,spacingY=32;
  var rows=[
    {type:EN_BOSS,count:4,row:0},
    {type:EN_BUTTERFLY,count:8,row:1},
    {type:EN_BUTTERFLY,count:8,row:2},
    {type:EN_BEE,count:10,row:3},
    {type:EN_BEE,count:10,row:4}
  ];
  for(var r=0;r<rows.length;r++){
    var rowDef=rows[r];
    var totalW=(rowDef.count-1)*spacingX;
    var startX=-totalW/2;
    for(var i=0;i<rowDef.count;i++){
      var e={
        type:rowDef.type,
        formX:startX+i*spacingX,
        formY:rowDef.row*spacingY,
        x:0,y:0,
        alive:true,
        hp:rowDef.type===EN_BOSS?2:1,
        diving:false,
        diveTimer:0,
        diveStartX:0,diveStartY:0,
        diveSide:1,
        diveShot:false,
        diveShot2:false,
        returning:false,
        enterTimer:0,
        entered:false,
        tractorBeam:false,
        tractorTimer:0,
        speedMult:1
      };
      // Stagger entrance timing: bosses first, then butterflies, then bees
      e.enterTimer=30+r*15+i*3;
      e.x=FORM_X+e.formX;
      e.y=-30-r*25-i*5;
      enemies.push(e);
    }
  }
  enemiesAlive=enemies.length;
}

// ===== GAME START =====
function startGame(){
  score=0;lives=3;stage=1;
  playerX=W/2;
  playerY=PLAYER_Y;
  playerBullets=[];
  enemyBullets=[];
  explosions=[];
  powerups=[];
  puSpread=false;puSpreadTimer=0;
  puSpeed=false;puSpeedTimer=0;
  puShield=false;puShieldHits=0;
  puRapid=false;puRapidTimer=0;
  shootCooldown=0;
  setupStage();
}

function setupStage(){
  diveInterval=Math.max(40,120-stage*8);
  diveBulletSpeed=Math.min(6,3+stage*0.2);
  maxDivers=Math.min(5,2+Math.floor(stage/3));
  var speedMult=1+Math.floor((stage-1)/3)*0.15;

  playerBullets=[];
  enemyBullets=[];
  explosions=[];
  powerups=[];
  shootCooldown=0;
  createFormation();
  diveTimer=150; // Give time for formation to enter
  formSwayAngle=0;

  for(var i=0;i<enemies.length;i++){
    enemies[i].speedMult=speedMult;
  }

  gameState=ST_STAGE_MSG;
  stageTimer=120;
}

// ===== EXPLOSION =====
function spawnExplosion(x,y,color){
  var count=6;
  for(var i=0;i<count;i++){
    var angle=Math.PI*2*i/count;
    var speed=1+Math.random()*2;
    explosions.push({
      x:x,y:y,
      vx:Math.cos(angle)*speed,
      vy:Math.sin(angle)*speed,
      life:20+Math.random()*10,
      maxLife:30,
      size:2+Math.random()*4,
      color:color||'#fff'
    });
  }
  if(explosions.length>48)explosions.splice(0,explosions.length-48);
}

// ===== POWER-UPS =====
var PU_SPREAD=0,PU_SPEED=1,PU_SHIELD=2,PU_RAPID=3,PU_BOMB=4,PU_LIFE=5;
var PU_COUNT=6;
var PU_COLORS=['#ff8800','#00ff88','#44ffff','#ff44ff','#ff4444','#ff88cc'];
var PU_LABELS=['SPR','SPD','SHL','RAP','BOM','+1'];
var powerups=[];
var puSpread=false,puSpreadTimer=0;
var puSpeed=false,puSpeedTimer=0;
var puShield=false,puShieldHits=0;
var puRapid=false,puRapidTimer=0;

function dropPowerup(x,y){
  if(Math.random()>0.20)return;
  powerups.push({x:x,y:y,type:Math.floor(Math.random()*PU_COUNT),wobble:0});
}

function applyPU(type){
  snd(800,0.15,'sine',0.12);
  if(type===PU_SPREAD){puSpread=true;puSpreadTimer=600;}
  else if(type===PU_SPEED){puSpeed=true;puSpeedTimer=600;}
  else if(type===PU_SHIELD){puShield=true;puShieldHits=3;}
  else if(type===PU_RAPID){puRapid=true;puRapidTimer=600;}
  else if(type===PU_BOMB){
    // Kill all enemies on screen that are diving
    snd(60,0.5,'sawtooth',0.15);
    for(var i=0;i<enemies.length;i++){
      var e=enemies[i];
      if(e.alive&&e.diving){
        e.alive=false;enemiesAlive--;
        score+=EN_POINTS[e.type]*2;
        spawnExplosion(e.x,e.y,EN_COLORS[e.type][0]);
      }
    }
    enemyBullets=[];
  }
  else if(type===PU_LIFE){lives=Math.min(5,lives+1);}
}

// ===== DRAW PLAYER SHIP =====
function drawPlayer(x,y,scale){
  var s=scale||1;
  ctx.fillStyle='#fff';
  ctx.beginPath();
  ctx.moveTo(x,y-12*s);
  ctx.lineTo(x-4*s,y-6*s);
  ctx.lineTo(x-4*s,y+2*s);
  ctx.lineTo(x-12*s,y+6*s);
  ctx.lineTo(x-14*s,y+12*s);
  ctx.lineTo(x-6*s,y+12*s);
  ctx.lineTo(x-4*s,y+8*s);
  ctx.lineTo(x-2*s,y+6*s);
  ctx.lineTo(x+2*s,y+6*s);
  ctx.lineTo(x+4*s,y+8*s);
  ctx.lineTo(x+6*s,y+12*s);
  ctx.lineTo(x+14*s,y+12*s);
  ctx.lineTo(x+12*s,y+6*s);
  ctx.lineTo(x+4*s,y+2*s);
  ctx.lineTo(x+4*s,y-6*s);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle='#4488ff';
  ctx.fillRect(x-2*s,y-4*s,4*s,6*s);
  ctx.fillStyle='#88ccff';
  ctx.beginPath();
  ctx.moveTo(x,y-12*s);
  ctx.lineTo(x-2*s,y-6*s);
  ctx.lineTo(x+2*s,y-6*s);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle='#4488ff';
  ctx.fillRect(x-13*s,y+8*s,7*s,3*s);
  ctx.fillRect(x+6*s,y+8*s,7*s,3*s);
}

// ===== DRAW ENEMIES =====
function drawBee(x,y){
  ctx.fillStyle='#4488ff';
  ctx.beginPath();
  ctx.moveTo(x,y-8);
  ctx.lineTo(x-6,y);
  ctx.lineTo(x-10,y+8);
  ctx.lineTo(x-4,y+6);
  ctx.lineTo(x-2,y+10);
  ctx.lineTo(x+2,y+10);
  ctx.lineTo(x+4,y+6);
  ctx.lineTo(x+10,y+8);
  ctx.lineTo(x+6,y);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle='#88ccff';
  ctx.fillRect(x-2,y-2,4,4);
}

function drawButterfly(x,y){
  ctx.fillStyle='#ff4488';
  ctx.beginPath();
  ctx.moveTo(x,y-8);
  ctx.lineTo(x-5,y-4);
  ctx.lineTo(x-12,y-6);
  ctx.lineTo(x-14,y+2);
  ctx.lineTo(x-10,y+6);
  ctx.lineTo(x-6,y+4);
  ctx.lineTo(x-3,y+10);
  ctx.lineTo(x+3,y+10);
  ctx.lineTo(x+6,y+4);
  ctx.lineTo(x+10,y+6);
  ctx.lineTo(x+14,y+2);
  ctx.lineTo(x+12,y-6);
  ctx.lineTo(x+5,y-4);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle='#ffaacc';
  ctx.fillRect(x-3,y-4,6,8);
}

function drawBoss(x,y,hp){
  var c1=hp<=1?'#aaaa22':'#44ff44';
  var c2=hp<=1?'#dddd44':'#88ffaa';
  ctx.fillStyle=c1;
  ctx.beginPath();
  ctx.moveTo(x,y-10);
  ctx.lineTo(x-6,y-6);
  ctx.lineTo(x-10,y-8);
  ctx.lineTo(x-14,y-2);
  ctx.lineTo(x-16,y+4);
  ctx.lineTo(x-10,y+8);
  ctx.lineTo(x-6,y+12);
  ctx.lineTo(x-2,y+8);
  ctx.lineTo(x+2,y+8);
  ctx.lineTo(x+6,y+12);
  ctx.lineTo(x+10,y+8);
  ctx.lineTo(x+16,y+4);
  ctx.lineTo(x+14,y-2);
  ctx.lineTo(x+10,y-8);
  ctx.lineTo(x+6,y-6);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle=c2;
  ctx.beginPath();
  ctx.moveTo(x-4,y-6);
  ctx.lineTo(x,y-14);
  ctx.lineTo(x+4,y-6);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle='#fff';
  ctx.fillRect(x-8,y-2,4,4);
  ctx.fillRect(x+4,y-2,4,4);
  ctx.fillStyle='#000';
  ctx.fillRect(x-6,y,2,2);
  ctx.fillRect(x+6,y,2,2);
}

function drawEnemy(e){
  if(!e.alive)return;
  // Don't draw if still off screen waiting to enter
  if(!e.entered&&e.enterTimer>0)return;
  switch(e.type){
    case EN_BEE:drawBee(e.x,e.y);break;
    case EN_BUTTERFLY:drawButterfly(e.x,e.y);break;
    case EN_BOSS:drawBoss(e.x,e.y,e.hp);break;
  }
  // Tractor beam effect
  if(e.tractorBeam&&e.tractorTimer>0){
    ctx.fillStyle='rgba(68,255,68,0.12)';
    ctx.beginPath();
    ctx.moveTo(e.x-8,e.y+14);
    ctx.lineTo(e.x-30,e.y+130);
    ctx.lineTo(e.x+30,e.y+130);
    ctx.lineTo(e.x+8,e.y+14);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle='rgba(68,255,68,0.25)';
    ctx.beginPath();
    ctx.moveTo(e.x-4,e.y+14);
    ctx.lineTo(e.x-16,e.y+130);
    ctx.lineTo(e.x+16,e.y+130);
    ctx.lineTo(e.x+4,e.y+14);
    ctx.closePath();
    ctx.fill();
  }
}

// ===== UPDATE =====
function update(){
  tick++;

  if(gameState===ST_STAGE_MSG){
    stageTimer--;
    if(stageTimer<=0){
      gameState=ST_PLAY;
    }
    updateFormation();
    return;
  }

  if(gameState===ST_DEATH){
    deathTimer--;
    updateExplosions();
    if(deathTimer<=0){
      if(lives<=0){
        gameState=ST_OVER;
        if(score>highScore){highScore=score;localStorage.setItem('galaga_hi',highScore);}
      } else {
        playerX=W/2;
        playerY=PLAYER_Y;
        enemyBullets=[];
        gameState=ST_PLAY;
      }
    }
    return;
  }

  if(gameState!==ST_PLAY)return;

  // Player movement
  var spd=puSpeed?7:PLAYER_SPEED;
  if(keys[37])playerX-=spd;
  if(keys[39])playerX+=spd;
  if(keys[38])playerY-=spd;
  if(keys[40])playerY+=spd;
  if(playerX<16)playerX=16;
  if(playerX>W-16)playerX=W-16;
  if(playerY<H/2)playerY=H/2;
  if(playerY>H-30)playerY=H-30;

  // Shooting
  var maxBullets=puSpread?6:MAX_PLAYER_BULLETS;
  var cooldown=puRapid?5:10;
  if(shootCooldown>0)shootCooldown--;
  if((keys[32]||keys[23]||keys[13]||keys[66]||keys[62]||keys[160])&&shootCooldown<=0&&playerBullets.length<maxBullets){
    playerBullets.push({x:playerX,y:playerY-14,vx:0,vy:-BULLET_SPEED});
    if(puSpread){
      playerBullets.push({x:playerX-6,y:playerY-12,vx:-1.5,vy:-BULLET_SPEED});
      playerBullets.push({x:playerX+6,y:playerY-12,vx:1.5,vy:-BULLET_SPEED});
    }
    sndShoot();
    shootCooldown=cooldown;
  }

  // Update player bullets
  for(var i=playerBullets.length-1;i>=0;i--){
    playerBullets[i].x+=(playerBullets[i].vx||0);
    playerBullets[i].y+=playerBullets[i].vy||-BULLET_SPEED;
    if(playerBullets[i].y<-10||playerBullets[i].x<-10||playerBullets[i].x>W+10)playerBullets.splice(i,1);
  }

  // Update formation sway
  updateFormation();

  // Dive attack timer
  diveTimer--;
  if(diveTimer<=0){
    startDiveAttack();
    diveTimer=diveInterval+Math.floor(Math.random()*60);
  }

  // Update diving enemies
  updateDivers();

  // Update enemy bullets
  for(var i=enemyBullets.length-1;i>=0;i--){
    var b=enemyBullets[i];
    b.x+=(b.vx||0);
    b.y+=b.vy;
    if(b.y>H+10||b.y<-10||b.x<-10||b.x>W+10){
      enemyBullets.splice(i,1);
    }
  }

  // Collision: player bullets vs enemies
  for(var i=playerBullets.length-1;i>=0;i--){
    var b=playerBullets[i];
    var hitSomething=false;
    for(var j=0;j<enemies.length;j++){
      var e=enemies[j];
      if(!e.alive)continue;
      var hitW=e.type===EN_BOSS?16:e.type===EN_BUTTERFLY?14:10;
      var hitH=e.type===EN_BOSS?14:10;
      if(b.x>e.x-hitW&&b.x<e.x+hitW&&b.y>e.y-hitH&&b.y<e.y+hitH){
        e.hp--;
        if(e.hp<=0){
          e.alive=false;
          enemiesAlive--;
          var pts=EN_POINTS[e.type];
          if(e.diving)pts*=2;
          score+=pts;
          if(score>highScore){highScore=score;localStorage.setItem('galaga_hi',highScore);}
          spawnExplosion(e.x,e.y,EN_COLORS[e.type][0]);
          dropPowerup(e.x,e.y);
          sndHit();
        } else {
          sndBossHit();
        }
        hitSomething=true;
        break;
      }
    }
    if(hitSomething)playerBullets.splice(i,1);
  }

  // Collision: enemy bullets vs player
  for(var i=enemyBullets.length-1;i>=0;i--){
    var b=enemyBullets[i];
    if(b.x>playerX-12&&b.x<playerX+12&&b.y>playerY-10&&b.y<playerY+12){
      if(puShield){
        puShieldHits--;
        if(puShieldHits<=0)puShield=false;
        spawnExplosion(playerX,playerY,'#44ffff');
        snd(400,0.1,'triangle',0.1);
        enemyBullets.splice(i,1);
      } else {
        playerDie();
        enemyBullets.splice(i,1);
        break;
      }
    }
  }

  // Collision: diving enemies vs player
  for(var j=0;j<enemies.length;j++){
    var e=enemies[j];
    if(!e.alive||!e.diving)continue;
    if(Math.abs(e.x-playerX)<14&&Math.abs(e.y-playerY)<14){
      e.alive=false;
      enemiesAlive--;
      spawnExplosion(e.x,e.y,EN_COLORS[e.type][0]);
      if(puShield){
        puShieldHits--;
        if(puShieldHits<=0)puShield=false;
        spawnExplosion(playerX,playerY,'#44ffff');
        snd(400,0.1,'triangle',0.1);
      } else {
        playerDie();
        break;
      }
    }
  }

  // Update explosions
  updateExplosions();

  // Power-ups
  for(var i=powerups.length-1;i>=0;i--){
    var pu=powerups[i];
    pu.y+=1.5;pu.wobble+=0.08;
    if(pu.y>H+20){powerups.splice(i,1);continue;}
    if(Math.abs(pu.x-playerX)<18&&Math.abs(pu.y-playerY)<18){
      applyPU(pu.type);powerups.splice(i,1);
    }
  }

  // Power-up timers
  if(puSpread){puSpreadTimer--;if(puSpreadTimer<=0)puSpread=false;}
  if(puSpeed){puSpeedTimer--;if(puSpeedTimer<=0)puSpeed=false;}
  if(puRapid){puRapidTimer--;if(puRapidTimer<=0)puRapid=false;}

  // Check stage clear
  if(enemiesAlive<=0){
    sndStageClear();
    stage++;
    setupStage();
  }
}

function playerDie(){
  lives--;
  spawnExplosion(playerX,playerY,'#4488ff');
  spawnExplosion(playerX,playerY,'#fff');
  sndDeath();
  gameState=ST_DEATH;
  deathTimer=90;
  playerBullets=[];
  powerups=[];
}

function updateFormation(){
  formSwayAngle+=FORM_SWAY_SPEED;
  var swayX=Math.sin(formSwayAngle)*FORM_SWAY_AMP;

  for(var i=0;i<enemies.length;i++){
    var e=enemies[i];
    if(!e.alive||e.diving)continue;

    if(!e.entered){
      e.enterTimer--;
      if(e.enterTimer>0)continue;
      // Fly into formation position
      var targetX=FORM_X+e.formX+swayX;
      var targetY=FORM_Y+e.formY;
      var dx=targetX-e.x;
      var dy=targetY-e.y;
      var dist=Math.sqrt(dx*dx+dy*dy);
      if(dist<4){
        e.entered=true;
        e.x=targetX;
        e.y=targetY;
      } else {
        var spd=4;
        e.x+=dx/dist*spd;
        e.y+=dy/dist*spd;
      }
    } else {
      e.x=FORM_X+e.formX+swayX;
      e.y=FORM_Y+e.formY;
    }
  }
}

function startDiveAttack(){
  var currentDivers=0;
  for(var i=0;i<enemies.length;i++){
    if(enemies[i].alive&&enemies[i].diving)currentDivers++;
  }
  if(currentDivers>=maxDivers)return;

  var candidates=[];
  for(var i=0;i<enemies.length;i++){
    if(enemies[i].alive&&!enemies[i].diving&&enemies[i].entered)candidates.push(i);
  }
  if(candidates.length===0)return;

  var numDivers=1+Math.floor(Math.random()*Math.min(2,maxDivers-currentDivers));
  for(var d=0;d<numDivers&&candidates.length>0;d++){
    var ci=Math.floor(Math.random()*candidates.length);
    var idx=candidates[ci];
    candidates.splice(ci,1);
    var e=enemies[idx];
    e.diving=true;
    e.diveTimer=0;
    e.diveStartX=e.x;
    e.diveStartY=e.y;
    e.diveSide=e.x>W/2?-1:1;
    e.diveShot=false;
    e.diveShot2=false;
    e.returning=false;
    e.tractorBeam=false;
    e.tractorTimer=0;

    // Boss occasionally does tractor beam
    if(e.type===EN_BOSS&&Math.random()<0.25){
      e.tractorBeam=true;
      e.tractorTimer=90;
    }
  }
}

function updateDivers(){
  for(var i=0;i<enemies.length;i++){
    var e=enemies[i];
    if(!e.alive||!e.diving)continue;

    var speed=(e.speedMult||1)*2.5;
    e.diveTimer++;

    // Tractor beam phase
    if(e.tractorBeam&&e.tractorTimer>0){
      e.tractorTimer--;
      var tdx=playerX-e.x;
      if(Math.abs(tdx)>2)e.x+=tdx*0.02;
      e.y+=0.3;
      if(e.tractorTimer<=0){
        e.tractorBeam=false;
        e.diveTimer=0;
        e.diveStartX=e.x;
        e.diveStartY=e.y;
      }
      continue;
    }

    if(!e.returning){
      // Curved swoop using sin wave
      var t=e.diveTimer*0.03*speed;
      e.x=e.diveStartX+Math.sin(t*2)*60*e.diveSide;
      e.y=e.diveStartY+e.diveTimer*speed*1.2;

      // Fire bullets while diving (aimed at player)
      if(!e.diveShot&&e.diveTimer>20&&enemyBullets.length<MAX_ENEMY_BULLETS){
        e.diveShot=true;
        var ang=Math.atan2(playerY-e.y,playerX-e.x);
        enemyBullets.push({x:e.x,y:e.y+8,vx:Math.cos(ang)*diveBulletSpeed,vy:Math.sin(ang)*diveBulletSpeed});
        sndEnemyShoot();
      }
      if(!e.diveShot2&&e.diveTimer>45&&enemyBullets.length<MAX_ENEMY_BULLETS){
        e.diveShot2=true;
        var ang=Math.atan2(playerY-e.y,playerX-e.x);
        enemyBullets.push({x:e.x,y:e.y+8,vx:Math.cos(ang)*diveBulletSpeed,vy:Math.sin(ang)*diveBulletSpeed});
        sndEnemyShoot();
      }

      // Past bottom - loop back from top
      if(e.y>H+30){
        e.returning=true;
        e.diveTimer=0;
        e.x=e.diveStartX+(Math.random()-0.5)*40;
        e.y=-30;
      }
    } else {
      // Return to formation slot
      var swayX=Math.sin(formSwayAngle)*FORM_SWAY_AMP;
      var targetX=FORM_X+e.formX+swayX;
      var targetY=FORM_Y+e.formY;
      var dx=targetX-e.x;
      var dy=targetY-e.y;
      var dist=Math.sqrt(dx*dx+dy*dy);
      if(dist<4){
        e.x=targetX;
        e.y=targetY;
        e.diving=false;
        e.returning=false;
      } else {
        e.x+=dx/dist*3;
        e.y+=dy/dist*3;
      }
    }
  }
}

function updateExplosions(){
  for(var i=explosions.length-1;i>=0;i--){
    var p=explosions[i];
    p.x+=p.vx;
    p.y+=p.vy;
    p.life--;
    if(p.life<=0)explosions.splice(i,1);
  }
}

// ===== DRAW =====
function draw(){
  ctx.fillStyle='#000';
  ctx.fillRect(0,0,W,H);

  // Stars
  for(var i=0;i<stars.length;i++){
    var s=stars[i];
    var b=s.b*0.6+(Math.sin(tick*0.02+i)*0.2+0.2);
    var gb=Math.floor(Math.max(0,Math.min(255,b*255)));
    ctx.fillStyle='rgb('+gb+','+gb+','+gb+')';
    ctx.fillRect(s.x,s.y,s.s,s.s);
  }

  if(gameState===ST_TITLE){
    drawTitle();
    return;
  }

  if(gameState===ST_OVER){
    drawHUD();
    drawGameOver();
    return;
  }

  // Enemies
  for(var i=0;i<enemies.length;i++){
    drawEnemy(enemies[i]);
  }

  // Player (hide during death)
  if(gameState!==ST_DEATH){
    drawPlayer(playerX,playerY);
  }

  // Player bullets
  ctx.fillStyle='#fff';
  for(var i=0;i<playerBullets.length;i++){
    var b=playerBullets[i];
    ctx.fillRect(b.x-1,b.y-4,3,8);
  }

  // Enemy bullets
  for(var i=0;i<enemyBullets.length;i++){
    var b=enemyBullets[i];
    ctx.fillStyle='#ff4444';
    ctx.fillRect(b.x-2,b.y-3,4,6);
  }

  // Power-ups
  for(var i=0;i<powerups.length;i++){
    var pu=powerups[i],wx=Math.sin(pu.wobble)*3;
    ctx.fillStyle=PU_COLORS[pu.type];
    ctx.fillRect(pu.x+wx-14,pu.y-7,28,14);
    ctx.fillStyle='#000';
    ctx.font='bold 9px Courier New';
    ctx.textAlign='center';
    ctx.fillText(PU_LABELS[pu.type],pu.x+wx,pu.y+3);
  }

  // Shield indicator
  if(puShield&&gameState!==ST_DEATH){
    ctx.strokeStyle='rgba(68,255,255,0.6)';
    ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(playerX,playerY,18,0,6.28);ctx.stroke();
  }

  // Explosions
  for(var i=0;i<explosions.length;i++){
    var p=explosions[i];
    var alpha=p.life/p.maxLife;
    ctx.globalAlpha=alpha;
    ctx.fillStyle=p.color;
    ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);
  }
  ctx.globalAlpha=1;

  // HUD
  drawHUD();

  // Stage message overlay
  if(gameState===ST_STAGE_MSG){
    drawStageMessage();
  }
}

function drawHUD(){
  ctx.font='14px Courier New';
  // Score
  ctx.fillStyle='#fff';
  ctx.textAlign='left';
  ctx.fillText('SCORE',10,18);
  ctx.fillStyle='#ffff44';
  ctx.fillText(String(score),10,34);
  // High score
  ctx.fillStyle='#ff4444';
  ctx.textAlign='center';
  ctx.fillText('HIGH SCORE',W/2,18);
  ctx.fillStyle='#fff';
  ctx.fillText(String(highScore),W/2,34);
  // Stage indicator
  ctx.fillStyle='#88ff88';
  ctx.textAlign='center';
  ctx.fillText('STAGE '+stage,W/2,H-8);
  // Lives (small ship icons)
  ctx.textAlign='right';
  ctx.fillStyle='#fff';
  ctx.fillText('LIVES',W-10,18);
  for(var i=0;i<lives;i++){
    drawPlayer(W-30-i*24,42,0.5);
  }
  // Active power-up indicators
  var puY=62;
  ctx.font='bold 9px Courier New';
  ctx.textAlign='left';
  if(puSpread){ctx.fillStyle=PU_COLORS[PU_SPREAD];ctx.fillText('SPR '+Math.ceil(puSpreadTimer/60)+'s',10,puY);puY+=12;}
  if(puSpeed){ctx.fillStyle=PU_COLORS[PU_SPEED];ctx.fillText('SPD '+Math.ceil(puSpeedTimer/60)+'s',10,puY);puY+=12;}
  if(puShield){ctx.fillStyle=PU_COLORS[PU_SHIELD];ctx.fillText('SHL x'+puShieldHits,10,puY);puY+=12;}
  if(puRapid){ctx.fillStyle=PU_COLORS[PU_RAPID];ctx.fillText('RAP '+Math.ceil(puRapidTimer/60)+'s',10,puY);puY+=12;}
}

function drawTitle(){
  ctx.fillStyle='#ff4444';
  ctx.font='bold 48px Courier New';
  ctx.textAlign='center';
  ctx.fillText('GALAGA',W/2,180);

  ctx.fillStyle='#4488ff';
  ctx.font='16px Courier New';
  ctx.fillText('HTML5 ARCADE',W/2,215);

  // Enemy showcase with point values
  var sy=290;
  drawBee(W/2-100,sy);
  ctx.fillStyle='#4488ff';
  ctx.font='13px Courier New';
  ctx.textAlign='left';
  ctx.fillText('FIGHTER  = 100 PTS',W/2-75,sy+5);

  drawButterfly(W/2-100,sy+40);
  ctx.fillStyle='#ff4488';
  ctx.fillText('BUTTERFLY= 160 PTS',W/2-75,sy+45);

  drawBoss(W/2-100,sy+80,2);
  ctx.fillStyle='#44ff44';
  ctx.fillText('BOSS     = 400 PTS',W/2-75,sy+85);

  ctx.textAlign='center';
  ctx.fillStyle='#888';
  ctx.font='12px Courier New';
  ctx.fillText('DIVING ENEMIES = DOUBLE POINTS!',W/2,sy+120);

  ctx.fillStyle='#ffff44';
  ctx.font='14px Courier New';
  ctx.fillText('HIGH SCORE: '+highScore,W/2,sy+155);

  ctx.fillStyle='#888';
  ctx.font='12px Courier New';
  ctx.fillText('ARROWS: MOVE (ALL DIRS)  SPACE: SHOOT',W/2,sy+190);

  var blink=Math.sin(tick*0.06)>0;
  if(blink){
    ctx.fillStyle='#fff';
    ctx.font='18px Courier New';
    ctx.fillText('PRESS ENTER TO START',W/2,sy+230);
  }
}

function drawStageMessage(){
  ctx.fillStyle='#ffff44';
  ctx.font='bold 32px Courier New';
  ctx.textAlign='center';
  ctx.fillText('STAGE '+stage,W/2,H/2-10);
  ctx.fillStyle='#888';
  ctx.font='14px Courier New';
  ctx.fillText('GET READY!',W/2,H/2+20);
}

function drawGameOver(){
  ctx.fillStyle='#ff4444';
  ctx.font='bold 36px Courier New';
  ctx.textAlign='center';
  ctx.fillText('GAME OVER',W/2,H/2-30);

  ctx.fillStyle='#ffff44';
  ctx.font='16px Courier New';
  ctx.fillText('FINAL SCORE: '+score,W/2,H/2+10);

  if(score>=highScore&&score>0){
    ctx.fillStyle='#44ff44';
    ctx.fillText('NEW HIGH SCORE!',W/2,H/2+40);
  }

  ctx.fillStyle='#fff';
  ctx.font='14px Courier New';
  ctx.fillText('REACHED STAGE '+stage,W/2,H/2+70);

  var blink=Math.sin(tick*0.06)>0;
  if(blink){
    ctx.fillStyle='#888';
    ctx.fillText('PRESS ENTER FOR TITLE',W/2,H/2+110);
  }
}

// ===== GAME LOOP =====
function gameLoop(){
  update();
  draw();
  requestAnimationFrame(gameLoop);
}
gameLoop();
</script>
