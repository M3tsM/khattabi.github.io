<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Games · khattabi.ly</title>
<style>
  :root { --bg:#05070d; --card:#0f1b2f; --line:#24375a; --text:#cfd8f0; --muted:#7f8db0; --accent:#9ac6ff; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { min-height:100vh; background:linear-gradient(140deg,#05070d 0%,#0f1b2f 70%,#111f36 100%); color:var(--text);
         font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; padding:48px 16px; }
  main { max-width:880px; margin:0 auto; }
  h1 { font-size:2rem; letter-spacing:.02em; }
  p.sub { color:var(--muted); margin:4px 0 32px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:16px; }
  a.card { display:block; padding:24px 20px; border:1px solid var(--line); border-radius:12px; background:rgba(15,27,47,.7);
           color:inherit; text-decoration:none; transition:border-color .15s, transform .15s; }
  a.card:hover, a.card:focus-visible { border-color:var(--accent); transform:translateY(-2px); outline:none; }
  .icon { font-size:2rem; }
  .name { font-weight:600; font-size:1.1rem; margin-top:8px; }
  .desc { color:var(--muted); font-size:.9rem; }
</style>
</head>
<body>
<main>
  <h1>Games</h1>
  <p class="sub">Play in the browser. Keyboard or mouse.</p>
  <div class="grid">
    <a class="card" href="arkanoid.html"><div class="icon">🧱</div><div class="name">Super Arkanoid</div><div class="desc">33 levels, 16 power-ups</div></a>
    <a class="card" href="pacman.html"><div class="icon">🟡</div><div class="name">Pac-Man</div><div class="desc">Maze chase</div></a>
    <a class="card" href="galaga.html"><div class="icon">🚀</div><div class="name">Galaga</div><div class="desc">Space shooter</div></a>
    <a class="card" href="frogger.html"><div class="icon">🐸</div><div class="name">Super Frogger</div><div class="desc">Cross the road and river</div></a>
    <a class="card" href="mathsbabies.html"><div class="icon">➕</div><div class="name">Maths Babies</div><div class="desc">Maths for little ones</div></a>
  </div>
</main>
</body>
</html>
