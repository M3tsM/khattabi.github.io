<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Maths Babies</title>
<style>
  html,body{margin:0;height:100%;background:#0a0a16;overflow:hidden;font-family:'Trebuchet MS',Verdana,sans-serif}
  #wrap{display:flex;justify-content:center;align-items:center;height:100vh}
  canvas{display:block;background:#0a0a16;image-rendering:auto}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<script>
(function(){
"use strict";
var cv=document.getElementById('c'),ctx=cv.getContext('2d');
var W=960,H=600;cv.width=W;cv.height=H;
function resize(){var s=Math.min(window.innerWidth/W,window.innerHeight/H);cv.style.width=(W*s)+'px';cv.style.height=(H*s)+'px';}
window.addEventListener('resize',resize);resize();

// ---------- audio ----------
var AC=null;
function initAudio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}}
function beep(f,d,type,vol){if(!AC)return;var o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.value=vol||0.08;o.connect(g);g.connect(AC.destination);var t=AC.currentTime;o.start(t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.stop(t+d);}
function sndRight(){beep(700,0.12,'sine',0.09);setTimeout(function(){beep(1050,0.16,'sine',0.09);},90);}
function sndWrong(){beep(150,0.4,'sawtooth',0.12);setTimeout(function(){beep(90,0.5,'square',0.1);},120);}
function sndCry(){beep(420+Math.random()*260,0.18,'square',0.05);}

// ---------- helpers ----------
function ri(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=b;b=a%b;a=t;}return a;}
function sgn(n){return n>=0?'+ '+n:'- '+(-n);}

// ---------- question generators ----------
function gLinear(){var x=ri(2,9),a=ri(2,6),b=ri(1,12)*(Math.random()<.5?1:-1),c=a*x+b;
  return{text:'Solve for x:    '+a+'x '+sgn(b)+' = '+c,correct:''+x,wrongs:[''+(x+1),''+(x-1),''+(x+2),''+(-x),''+(x+3)]};}
function gPercent(){var P,N,ans;do{P=[5,10,15,20,25,40,50,75][ri(0,7)];N=ri(2,40)*5;ans=P*N/100;}while(!Number.isInteger(ans));
  return{text:'What is '+P+'% of '+N+'?',correct:''+ans,wrongs:[''+(ans+5),''+(ans-5),''+(ans+10),''+Math.round(ans*1.5),''+(ans+1)]};}
function gQuad(){var r1=ri(-6,6),r2=ri(-5,6);if(r1===0&&r2===0)r2=2;var b=-(r1+r2),c=r1*r2;
  var lo=Math.min(r1,r2),hi=Math.max(r1,r2);
  var corr=(r1===r2)?('x = '+r1):('x = '+lo+' or x = '+hi);
  return{text:'Solve:    x² '+sgn(b)+'x '+sgn(c)+' = 0',correct:corr,
    wrongs:['x = '+(-lo)+' or x = '+(-hi),'x = '+(lo+1)+' or x = '+hi,'x = '+lo+' or x = '+(hi+1),'x = '+(lo-1)+' or x = '+(hi-1)]};}
function gPythag(){var T=[[3,4,5],[5,12,13],[6,8,10],[8,15,17],[9,12,15],[7,24,25],[20,21,29],[10,24,26]];var t=T[ri(0,T.length-1)];
  return{text:'Right-angled triangle has legs '+t[0]+' and '+t[1]+'.\nFind the hypotenuse.',correct:''+t[2],
    wrongs:[''+(t[2]+1),''+(t[2]-1),''+(t[0]+t[1]),''+(t[2]+2)]};}
function gIndices(){var base=ri(2,6),m=ri(2,6),n=ri(2,6);
  return{text:'Simplify:    '+base+'^'+m+' × '+base+'^'+n,correct:base+'^'+(m+n),
    wrongs:[base+'^'+(m*n),(base*base)+'^'+(m+n),base+'^'+(m+n+1),(base)+'^'+(m+n-1)]};}
function gExpand(){var a=ri(1,7),b=ri(1,7);
  return{text:'Expand:    (x + '+a+')(x + '+b+')',correct:'x² + '+(a+b)+'x + '+(a*b),
    wrongs:['x² + '+(a*b)+'x + '+(a+b),'x² + '+(a+b)+'x + '+(a+b),'x² + '+(a+b+1)+'x + '+(a*b),'x² + '+(a*b)+'x + '+(a*b)]};}
function gSeq(){var a1=ri(1,9),d=ri(2,6),c=a1-d;var seq=[a1,a1+d,a1+2*d,a1+3*d];
  return{text:'Find the nth term:\n'+seq.join(',  ')+',  ...',correct:d+'n '+sgn(c),
    wrongs:[d+'n '+sgn(-c),(d+1)+'n '+sgn(c),d+'n + '+a1,(d-1)+'n '+sgn(c)]};}
function gMean(){var n=ri(4,5),nums,sum;do{nums=[];sum=0;for(var i=0;i<n;i++){var v=ri(1,20);nums.push(v);sum+=v;}}while(sum%n!==0);var ans=sum/n;
  return{text:'Find the mean:\n'+nums.join(',  '),correct:''+ans,wrongs:[''+(ans+1),''+(ans-1),''+(ans+2),''+sum]};}
function gCircle(){var r=ri(2,9);
  return{text:'Area of a circle, radius '+r+'.\n(give in terms of π)',correct:(r*r)+'π',
    wrongs:[(2*r)+'π',(r*r*2)+'π',(r)+'π',(r*r+1)+'π']};}
function gFraction(){var a,b;do{a=ri(1,5);b=ri(2,7);}while(gcd(a,b)!==1||a>=b);var g=ri(2,6);var num=a*g,den=b*g;
  return{text:'Simplify the fraction:    '+num+'/'+den,correct:a+'/'+b,
    wrongs:[(a+1)+'/'+b,a+'/'+(b+1),b+'/'+a,(a+1)+'/'+(b+1)]};}
var GENS=[gLinear,gPercent,gQuad,gPythag,gIndices,gExpand,gSeq,gMean,gCircle,gFraction];

function newQuestion(){
  var g=GENS[ri(0,GENS.length-1)]();
  var opts=[g.correct];
  for(var i=0;i<g.wrongs.length && opts.length<4;i++){if(opts.indexOf(g.wrongs[i])<0)opts.push(g.wrongs[i]);}
  var guard=0;while(opts.length<4&&guard++<50){var fake=''+ri(1,99);if(opts.indexOf(fake)<0)opts.push(fake);}
  shuffle(opts);
  return{text:g.text,options:opts,correctIndex:opts.indexOf(g.correct)};
}

// ---------- ugly baby (pre-rendered sprites for speed) ----------
function makeSpots(){var s=[];var n=ri(5,9);for(var i=0;i<n;i++){var ang=Math.random()*6.28,rad=Math.random()*16;s.push({x:Math.cos(ang)*rad,y:6+Math.sin(ang)*16});}for(var j=0;j<4;j++){var a=Math.random()*6.28,r=Math.random()*9;s.push({x:Math.cos(a)*r,y:-12+Math.sin(a)*9});}return s;}
// Draw the baby shapes once into an offscreen context, centred at (0,0)
function renderBabyShape(c,s,spots){
  c.fillStyle='#f3c19c';
  c.beginPath();c.ellipse(-7*s,25*s,5*s,8*s,0,0,6.3);c.fill();
  c.beginPath();c.ellipse(7*s,25*s,5*s,8*s,0,0,6.3);c.fill();
  c.beginPath();c.ellipse(-16*s,5*s,7*s,4.5*s,0.5,0,6.3);c.fill();
  c.beginPath();c.ellipse(16*s,5*s,7*s,4.5*s,-0.5,0,6.3);c.fill();
  c.beginPath();c.ellipse(0,8*s,17*s,19*s,0,0,6.3);c.fill();
  c.fillStyle='#e7ad84';c.beginPath();c.ellipse(0,12*s,8*s,5*s,0,0,6.3);c.fill();
  c.fillStyle='#f3c19c';c.beginPath();c.arc(0,-13*s,14*s,0,6.3);c.fill();
  c.fillStyle='rgba(240,140,120,.5)';c.beginPath();c.arc(-8*s,-9*s,3.5*s,0,6.3);c.fill();c.beginPath();c.arc(8*s,-9*s,3.5*s,0,6.3);c.fill();
  c.strokeStyle='#6b4422';c.lineWidth=2*s;c.beginPath();c.arc(0,-27*s,3*s,0.4,3.4);c.stroke();
  c.fillStyle='#e23b2e';for(var i=0;i<spots.length;i++){var sp=spots[i];c.beginPath();c.arc(sp.x*s,sp.y*s,2.1*s,0,6.3);c.fill();}
  c.strokeStyle='#000';c.lineWidth=1.6*s;
  c.beginPath();c.moveTo(-10*s,-19*s);c.lineTo(-3*s,-16*s);c.stroke();
  c.beginPath();c.moveTo(10*s,-19*s);c.lineTo(3*s,-16*s);c.stroke();
  c.fillStyle='#fff';c.beginPath();c.arc(-5*s,-13*s,3*s,0,6.3);c.fill();c.beginPath();c.arc(5*s,-13*s,3*s,0,6.3);c.fill();
  c.fillStyle='#000';c.beginPath();c.arc(-5*s,-12*s,1.6*s,0,6.3);c.fill();c.beginPath();c.arc(5*s,-12*s,1.6*s,0,6.3);c.fill();
  c.fillStyle='rgba(110,200,255,.9)';c.beginPath();c.ellipse(-6*s,-7*s,1.7*s,3*s,0,0,6.3);c.fill();c.beginPath();c.ellipse(6*s,-7*s,1.7*s,3*s,0,0,6.3);c.fill();
  c.strokeStyle='#000';c.lineWidth=1.8*s;c.beginPath();c.arc(0,-3*s,5*s,3.55,5.87);c.stroke();
}
var SPRITE_S=1.5,SPW=84,SPH=108,SPCX=42,SPCY=52,BABY_SPRITES=[];
function buildSprites(){for(var i=0;i<8;i++){var cn=document.createElement('canvas');cn.width=SPW;cn.height=SPH;var c=cn.getContext('2d');c.translate(SPCX,SPCY);renderBabyShape(c,SPRITE_S,makeSpots());BABY_SPRITES.push(cn);}}
function spawnBaby(px,py){return{x:px+(Math.random()-.5)*30,y:py,vx:(Math.random()-.5)*17,vy:-(4+Math.random()*13),rot:Math.random()*6.28,vr:(Math.random()-.5)*.4,s:0.55+Math.random()*0.85,sprite:ri(0,7),wob:Math.random()*6.28};}
function drawBaby(b){var img=BABY_SPRITES[b.sprite||0],k=b.s/SPRITE_S;ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.rot);ctx.drawImage(img,-SPCX*k,-SPCY*k,SPW*k,SPH*k);ctx.restore();}

// ---------- present ----------
function drawPresent(px,py,open,lidY){
  var w=70,h=58;
  // box base
  ctx.fillStyle='#c0392b';ctx.fillRect(px-w/2,py-h/2,w,h);
  ctx.fillStyle='#e74c3c';ctx.fillRect(px-w/2,py-h/2,w,12);
  // vertical ribbon
  ctx.fillStyle='#f1c40f';ctx.fillRect(px-7,py-h/2,14,h);
  // lid (pops up when open)
  var ly=py-h/2-10-lidY;
  ctx.save();ctx.translate(px,ly);ctx.rotate(open?(-0.3+Math.sin(lidY*0.1)*0.2):0);
  ctx.fillStyle='#a93226';ctx.fillRect(-w/2-5,-12,w+10,16);
  ctx.fillStyle='#f1c40f';ctx.fillRect(-7,-12,14,16);
  // bow
  ctx.fillStyle='#f1c40f';ctx.beginPath();ctx.ellipse(-10,-14,9,6,0,0,6.3);ctx.fill();ctx.beginPath();ctx.ellipse(10,-14,9,6,0,0,6.3);ctx.fill();
  ctx.fillStyle='#d4ac0d';ctx.beginPath();ctx.arc(0,-14,4,0,6.3);ctx.fill();
  ctx.restore();
}

// ---------- game state ----------
var ST_TITLE=0,ST_PLAY=1,ST_RIGHT=2,ST_WRONG=3,ST_OVER=4;
var state=ST_TITLE;
var lives=3,score=0,streak=0,best=+(localStorage.getItem('mb_best')||0);
var q=null,sel=0;
var babies=[],present={x:W/2,y:H/2,lidY:0,lidVy:0},fxTimer=0,spawnLeft=0,shake=0,lastWasCorrectIdx=-1;
var tick=0;

function startGame(){lives=3;score=0;streak=0;state=ST_PLAY;q=newQuestion();sel=0;}
function nextQuestion(){q=newQuestion();sel=0;state=ST_PLAY;}
function answer(i){
  if(state!==ST_PLAY)return;
  initAudio();
  if(i===q.correctIndex){score+=10;streak++;sndRight();state=ST_RIGHT;fxTimer=42;}
  else{
    lives--;streak=0;sndWrong();state=ST_WRONG;fxTimer=200;lastWasCorrectIdx=q.correctIndex;
    babies=[];present={x:W/2,y:H/2,lidY:0,lidVy:-11};
    spawnLeft=420; // MANY MANY MANY babies
    for(var k=0;k<60;k++)babies.push(spawnBaby(present.x,present.y-30));
    shake=18;
  }
}

// ---------- update ----------
function update(){
  tick++;
  if(shake>0)shake-=1;
  if(state===ST_RIGHT){fxTimer--;if(fxTimer<=0)nextQuestion();}
  else if(state===ST_WRONG){
    fxTimer--;
    present.lidVy+=0.5;present.lidY-=present.lidVy;if(present.lidY<0){present.lidY=0;present.lidVy=0;}
    // keep pouring babies
    if(spawnLeft>0&&babies.length<320){var n=Math.min(spawnLeft,6);for(var k=0;k<n;k++){babies.push(spawnBaby(present.x,present.y-28));}spawnLeft-=n;if(tick%6===0)sndCry();}
    for(var i=babies.length-1;i>=0;i--){var b=babies[i];b.vy+=0.42;b.x+=b.vx;b.y+=b.vy;b.rot+=b.vr;b.wob+=0.2;b.x+=Math.sin(b.wob)*0.6;
      if(b.y>H+70||b.x<-80||b.x>W+80)babies.splice(i,1);}
    if(fxTimer<=0){if(lives<=0){if(score>best){best=score;localStorage.setItem('mb_best',best);}state=ST_OVER;}else nextQuestion();}
  }
}

// ---------- draw ----------
function bg(){
  var g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#16213e');g.addColorStop(1,'#0f3460');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // soft grid
  ctx.strokeStyle='rgba(255,255,255,.04)';ctx.lineWidth=1;for(var x=0;x<W;x+=48){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}for(var y=0;y<H;y+=48){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
}
function drawHUD(){
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 22px Trebuchet MS';ctx.fillText('Score: '+score,20,34);
  ctx.textAlign='center';ctx.fillStyle='#9fd3ff';ctx.font='16px Trebuchet MS';ctx.fillText('Best: '+best,W/2,30);
  if(streak>1){ctx.fillStyle='#ffd54a';ctx.font='bold 16px Trebuchet MS';ctx.fillText('Streak x'+streak,W/2,52);}
  // hearts
  ctx.textAlign='right';for(var i=0;i<3;i++){drawHeart(W-26-i*34,26,12,i<lives);}
}
function drawHeart(cx,cy,r,full){
  ctx.save();ctx.translate(cx,cy);ctx.fillStyle=full?'#ff4d6d':'rgba(255,255,255,.18)';
  ctx.beginPath();ctx.moveTo(0,r*0.9);ctx.bezierCurveTo(-r*1.3,-r*0.4,-r*0.5,-r*1.1,0,-r*0.3);ctx.bezierCurveTo(r*0.5,-r*1.1,r*1.3,-r*0.4,0,r*0.9);ctx.fill();ctx.restore();
}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function multiline(txt,x,y,lh){var lines=txt.split('\n');for(var i=0;i<lines.length;i++)ctx.fillText(lines[i],x,y+i*lh);}

function drawQuestion(){
  // question card
  ctx.fillStyle='rgba(255,255,255,.96)';roundRect(W/2-380,80,760,120,18);ctx.fill();
  ctx.fillStyle='#15223e';ctx.textAlign='center';ctx.font='bold 30px Trebuchet MS';
  multiline(q.text,W/2,135,38);
  // options 2x2
  var ow=360,oh=78,gap=24,bx=W/2-ow-gap/2,by=240;
  for(var i=0;i<4;i++){
    var col=i%2,row=(i/2)|0;var x=bx+col*(ow+gap),y=by+row*(oh+gap);
    var focused=(i===sel);
    var fill=focused?'#ffd54a':'#1f4068';
    if(state===ST_RIGHT&&i===q.correctIndex)fill='#2ecc71';
    ctx.fillStyle=fill;roundRect(x,y,ow,oh,14);ctx.fill();
    if(focused){ctx.strokeStyle='#fff';ctx.lineWidth=3;roundRect(x,y,ow,oh,14);ctx.stroke();}
    ctx.fillStyle=focused?'#15223e':'#eaf2ff';ctx.font='bold 27px Trebuchet MS';ctx.textAlign='center';
    ctx.fillText(['A','B','C','D'][i]+'.   '+q.options[i],x+ow/2,y+oh/2+10);
  }
  ctx.fillStyle='rgba(255,255,255,.6)';ctx.font='15px Trebuchet MS';ctx.textAlign='center';
  ctx.fillText('Use ↑ ↓ ← →  then OK / SPACE  (or press 1-4)',W/2,H-26);
}

function draw(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  bg();
  if(state===ST_TITLE){
    ctx.textAlign='center';ctx.fillStyle='#ffd54a';ctx.font='bold 64px Trebuchet MS';ctx.fillText('MATHS  BABIES',W/2,180);
    ctx.fillStyle='#fff';ctx.font='22px Trebuchet MS';
    ctx.fillText('Answer GCSE maths questions. You have 3 lives.',W/2,250);
    ctx.fillStyle='#ff8a8a';ctx.fillText('Get one WRONG and a horde of ugly babies',W/2,288);
    ctx.fillText('comes flying out of a present!',W/2,318);
    // sample baby
    drawBaby({x:W/2-130,y:430,rot:-0.2,s:1.6,sprite:3});
    drawBaby({x:W/2+130,y:430,rot:0.2,s:1.6,sprite:6});
    drawPresent(W/2,440,false,0);
    ctx.fillStyle='#9fd3ff';ctx.font='bold 26px Trebuchet MS';
    if((tick>>4)&1)ctx.fillText('Press SPACE / OK to start',W/2,540);
    ctx.fillStyle='#888';ctx.font='15px Trebuchet MS';ctx.fillText('Best: '+best,W/2,H-20);
    ctx.restore();return;
  }
  drawHUD();
  if(state===ST_PLAY||state===ST_RIGHT){
    drawQuestion();
    if(state===ST_RIGHT){ctx.fillStyle='rgba(46,204,113,'+(0.25+0.1*Math.sin(tick))+')';ctx.fillRect(0,0,W,H);ctx.fillStyle='#2ecc71';ctx.font='bold 60px Trebuchet MS';ctx.textAlign='center';ctx.fillText('CORRECT! +10',W/2,H/2);}
  } else if(state===ST_WRONG){
    // dim question behind
    ctx.globalAlpha=0.25;drawQuestion();ctx.globalAlpha=1;
    drawPresent(present.x,present.y,true,present.lidY);
    for(var i=0;i<babies.length;i++)drawBaby(babies[i]);
    ctx.textAlign='center';ctx.fillStyle='#ff3b3b';ctx.font='bold 70px Trebuchet MS';ctx.fillText('WRONG!',W/2,90);
    ctx.fillStyle='#fff';ctx.font='bold 26px Trebuchet MS';ctx.fillText('Answer:  '+q.options[lastWasCorrectIdx],W/2,128);
  } else if(state===ST_OVER){
    for(var i=0;i<babies.length;i++)drawBaby(babies[i]);
    ctx.textAlign='center';ctx.fillStyle='#ff3b3b';ctx.font='bold 64px Trebuchet MS';ctx.fillText('GAME OVER',W/2,200);
    ctx.fillStyle='#fff';ctx.font='28px Trebuchet MS';ctx.fillText('Final Score: '+score,W/2,260);
    ctx.fillStyle='#9fd3ff';ctx.fillText('Best: '+best,W/2,300);
    ctx.fillStyle='#ffd54a';ctx.font='bold 26px Trebuchet MS';if((tick>>4)&1)ctx.fillText('Press SPACE / OK to play again',W/2,380);
  }
  ctx.restore();
}

function loop(){update();draw();requestAnimationFrame(loop);}

// ---------- input ----------
function move(d){if(state!==ST_PLAY)return;
  // grid: 0,1 / 2,3
  if(d==='left'){if(sel%2===1)sel--;}
  else if(d==='right'){if(sel%2===0)sel++;}
  else if(d==='up'){if(sel>=2)sel-=2;}
  else if(d==='down'){if(sel<2)sel+=2;}
  beep(400,0.04,'sine',0.04);
}
function confirm(){initAudio();
  if(state===ST_TITLE||state===ST_OVER){startGame();return;}
  if(state===ST_PLAY)answer(sel);
}
document.addEventListener('keydown',function(e){
  var k=e.code,kc=e.keyCode;
  if(k==='ArrowLeft')move('left');
  else if(k==='ArrowRight')move('right');
  else if(k==='ArrowUp')move('up');
  else if(k==='ArrowDown')move('down');
  else if(k==='Enter'||k==='Space'||kc===23||kc===13){confirm();}
  else if(kc>=49&&kc<=52){initAudio();if(state===ST_PLAY)answer(kc-49);}
  else if(kc>=97&&kc<=100){initAudio();if(state===ST_PLAY)answer(kc-97);}
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space','Enter'].indexOf(k)>=0)e.preventDefault();
});
cv.addEventListener('click',function(e){initAudio();
  if(state===ST_TITLE||state===ST_OVER){startGame();return;}
  if(state!==ST_PLAY)return;
  var rect=cv.getBoundingClientRect(),sx=W/rect.width,sy=H/rect.height;
  var mx=(e.clientX-rect.left)*sx,my=(e.clientY-rect.top)*sy;
  var ow=360,oh=78,gap=24,bx=W/2-ow-gap/2,by=240;
  for(var i=0;i<4;i++){var col=i%2,row=(i/2)|0;var x=bx+col*(ow+gap),y=by+row*(oh+gap);
    if(mx>=x&&mx<=x+ow&&my>=y&&my<=y+oh){sel=i;answer(i);return;}}
});

buildSprites();
loop();
})();
</script>
</body>
</html>
