<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Khattabi</title>
<meta name="description" content="khattabi.ly">
<meta name="theme-color" content="#04060c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@200;300&display=swap" rel="stylesheet">
<style>
  :root {
    --void: #04060c;
    --ink: #e8eeff;
    --muted: #b4c0de;
    --a1: #2f6bff;   /* electric blue */
    --a2: #19d3e6;   /* cyan */
    --a3: #8b5cf6;   /* violet */
    --a4: #14b8a6;   /* teal */
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--void);
    color: var(--ink);
    overflow: hidden;
    font-family: "Sora", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Aurora: tiny canvas, upscaled by the browser = free blur ---------- */
  #aurora { position: fixed; inset: 0; width: 100vw; height: 100vh; opacity: .55; }

  /* ---------- Flow-field canvas ---------- */
  #flow { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }

  /* Vignette keeps the edges calm and the centre readable */
  .vignette { position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(4,6,12,.75) 100%); }

  /* ---------- Wordmark ---------- */
  .hero { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; padding: 0 16px; text-align: center; }
  h1 {
    font-weight: 200; letter-spacing: .32em; text-transform: lowercase;
    font-size: clamp(2rem, 8vw, 6.5rem); line-height: 1;
    margin-right: -.32em;
    white-space: nowrap; /* optically centre tracked text */
    text-shadow: 0 0 40px rgba(47,107,255,.35);
  }
  h1 .ch {
    display: inline-block; opacity: 0; transform: translateY(.45em) rotateX(-50deg); filter: blur(8px);
    animation: rise .9s cubic-bezier(.16, 1, .3, 1) forwards;  /* expo.out */
    animation-delay: calc(.35s + var(--i) * 70ms);
    background: linear-gradient(100deg, #ffffff 0%, #cfe0ff 35%, #9fe9f3 55%, #ffffff 80%);
    background-size: 300% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  h1.lit .ch { animation: shimmer 10s ease-in-out infinite; animation-delay: calc(var(--i) * 120ms); opacity: 1; transform: none; filter: none; }
  @keyframes rise { to { opacity: 1; transform: none; filter: blur(0); } }
  @keyframes shimmer { 0%, 100% { background-position: 0% 0; } 50% { background-position: 100% 0; } }

  .tag {
    margin-top: 1.6rem; color: var(--muted); font-weight: 300;
    font-size: clamp(.7rem, 1.6vw, .85rem); letter-spacing: .5em; text-transform: uppercase; margin-right: -.5em;
    opacity: 0; animation: fade 1.4s ease-out 1.4s forwards;
  }
  .line {
    width: 0; height: 1px; margin: 1.6rem auto 0;
    background: linear-gradient(90deg, transparent, var(--a2), transparent);
    animation: grow 1.6s cubic-bezier(.16,1,.3,1) 1.1s forwards;
  }
  @keyframes fade { to { opacity: 1; } }
  @keyframes grow { to { width: min(320px, 60vw); } }

  @media (max-width: 520px) {
    h1 { letter-spacing: .14em; margin-right: -.14em; font-size: 11vw; }
    .tag { letter-spacing: .35em; margin-right: -.35em; }
  }

  @media (prefers-reduced-motion: reduce) {
    h1 .ch, .tag, .line { animation: none !important; }
    h1 .ch, .tag { opacity: 1; transform: none; filter: none; }
    .line { width: min(320px, 60vw); }
  }
</style>
</head>
<body>
<canvas id="aurora" aria-hidden="true"></canvas>
<canvas id="flow" aria-hidden="true"></canvas>
<div class="vignette" aria-hidden="true"></div>

<main class="hero">
  <div>
    <h1 id="mark" aria-label="khattabi">khattabi</h1>
    <div class="line" aria-hidden="true"></div>
    <p class="tag">khattabi.ly</p>
  </div>
</main>

<script>
(() => {
  // ---- Wordmark: split into letters for the staggered entrance ----
  const mark = document.getElementById('mark');
  const word = mark.textContent;
  mark.textContent = '';
  [...word].forEach((c, i) => {
    const s = document.createElement('span');
    s.className = 'ch'; s.textContent = c; s.style.setProperty('--i', i); s.setAttribute('aria-hidden', 'true');
    mark.appendChild(s);
  });
  setTimeout(() => mark.classList.add('lit'), 350 + word.length * 70 + 1000);

  // ---- Flow field ----
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const canvas = document.getElementById('flow');
  const ctx = canvas.getContext('2d');
  const palette = ['#5b8cff', '#3fe0f0', '#a78bfa', '#2dd4bf', '#dbe6ff'];
  let W, H, dpr, particles = [], t = 0, running = true;
  const pointer = { x: -1e4, y: -1e4, active: 0 };
  const shock = [];

  function field(x, y, time) {
    // layered trig "noise": smooth, swirling, cheap
    const s = 0.0016;
    const a = Math.sin(x * s + time * 0.6) + Math.cos(y * s * 1.3 - time * 0.4);
    const b = Math.sin((x + y) * s * 0.7 + time * 0.25) * 0.8;
    const c = Math.cos(Math.hypot(x - W * 0.5, y - H * 0.5) * s * 0.9 - time * 0.5) * 0.6;
    return (a + b + c) * Math.PI * 0.75;
  }

  function spawn(p) {
    p.x = Math.random() * W; p.y = Math.random() * H;
    p.px = p.x; p.py = p.y;
    p.life = 0; p.max = 220 + Math.random() * 380;
    p.speed = (0.8 + Math.random() * 1.3) * dpr;
    p.c = (Math.random() * palette.length) | 0;
    return p;
  }

  function resize() {
    sizeAurora(); drawAurora(0);
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.width = innerWidth * dpr;
    H = canvas.height = innerHeight * dpr;
    const target = Math.min(2200, Math.max(500, Math.floor(innerWidth * innerHeight / 900)));
    particles = Array.from({ length: target }, () => { const p = spawn({}); p.life = Math.random() * p.max; return p; });
    ctx.clearRect(0, 0, W, H);
    if (reduce) staticFrame();
  }

  function step() {
    t += 0.004;
    // fade previous frame -> trails; transparent so the aurora shows through.
    // 0.06 keeps the 8-bit residue floor below ~3% (lower values leave ghost lines)
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = 'rgba(0,0,0,0.06)';
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineWidth = 1.2 * dpr;
    ctx.lineCap = 'round';

    pointer.active *= 0.97;
    const R = 220 * dpr;

    // batch by colour: one path per palette entry
    const paths = palette.map(() => new Path2D());
    for (const p of particles) {
      const ang = field(p.x, p.y, t);
      let vx = Math.cos(ang) * p.speed, vy = Math.sin(ang) * p.speed;

      // pointer vortex: swirl around the cursor
      if (pointer.active > 0.01) {
        const dx = p.x - pointer.x, dy = p.y - pointer.y, d2 = dx * dx + dy * dy;
        if (d2 < R * R) {
          const d = Math.sqrt(d2) || 1, f = (1 - d / R) * 3.2 * pointer.active * dpr;
          vx += (-dy / d) * f + (dx / d) * f * 0.25;
          vy += ( dx / d) * f + (dy / d) * f * 0.25;
        }
      }
      // click shockwaves
      for (const s of shock) {
        const dx = p.x - s.x, dy = p.y - s.y, d = Math.hypot(dx, dy) || 1;
        const band = Math.abs(d - s.r);
        if (band < 60 * dpr) { const f = (1 - band / (60 * dpr)) * s.power * dpr; vx += dx / d * f; vy += dy / d * f; }
      }

      p.px = p.x; p.py = p.y;
      p.x += vx; p.y += vy;
      p.life++;
      if (p.life > p.max || p.x < -10 || p.x > W + 10 || p.y < -10 || p.y > H + 10) { spawn(p); continue; }
      const path = paths[p.c];
      path.moveTo(p.px, p.py); path.lineTo(p.x, p.y);
    }
    paths.forEach((path, i) => {
      ctx.strokeStyle = palette[i];
      ctx.globalAlpha = i === 4 ? 0.35 : 0.55;
      ctx.stroke(path);
    });
    ctx.globalAlpha = 1;

    for (let i = shock.length - 1; i >= 0; i--) {
      const s = shock[i]; s.r += 9 * dpr; s.power *= 0.95;
      if (s.power < 0.05) shock.splice(i, 1);
    }
  }

  // ---- Aurora: 4 colour lights drifting on 8-12s cycles, drawn at 1/10 scale ----
  const ac = document.getElementById('aurora'), ax = ac.getContext('2d');  // 1/10 scale
  const lights = [
    { c: [47, 107, 255],  x: .25, y: .30, r: .55, px: 11, py: 9,  ph: 0 },
    { c: [139, 92, 246],  x: .70, y: .22, r: .45, px: 12, py: 10, ph: 2 },
    { c: [25, 211, 230],  x: .45, y: .68, r: .50, px: 9,  py: 11, ph: 4 },
    { c: [20, 184, 166],  x: .78, y: .72, r: .38, px: 10, py: 8,  ph: 1 },
  ];
  function sizeAurora() { ac.width = Math.max(32, innerWidth / 10 | 0); ac.height = Math.max(32, innerHeight / 10 | 0); }
  function drawAurora(sec) {
    const w = ac.width, h = ac.height, m = Math.max(w, h);
    ax.globalCompositeOperation = 'source-over';
    ax.fillStyle = '#04060c'; ax.fillRect(0, 0, w, h);
    ax.globalCompositeOperation = 'lighter';
    for (const L of lights) {
      const k = 2 * Math.PI;
      const x = (L.x + Math.sin(sec * k / L.px + L.ph) * 0.08) * w;
      const y = (L.y + Math.cos(sec * k / L.py + L.ph) * 0.07) * h;
      const r = L.r * m * (1 + Math.sin(sec * k / (L.px + 2) + L.ph) * 0.12);
      const g = ax.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, `rgba(${L.c},0.5)`); g.addColorStop(1, `rgba(${L.c},0)`);
      ax.fillStyle = g; ax.fillRect(0, 0, w, h);
    }
  }

  let frame = 0;
  function loop(now) {
    if (!running) return;
    step();
    if ((frame++ & 3) === 0) drawAurora(now / 1000);  // aurora moves slowly; 15fps is plenty
    requestAnimationFrame(loop);
  }

  function staticFrame() {
    // reduced motion: draw settled streamlines once, no animation
    for (let k = 0; k < 140; k++) step();
  }

  addEventListener('resize', resize);
  addEventListener('pointermove', e => { pointer.x = e.clientX * dpr; pointer.y = e.clientY * dpr; pointer.active = 1; }, { passive: true });
  addEventListener('pointerdown', e => {
    if (reduce) return;
    shock.push({ x: e.clientX * dpr, y: e.clientY * dpr, r: 0, power: 2.4 });
  });
  document.addEventListener('visibilitychange', () => {
    if (reduce) return;
    running = !document.hidden;
    if (running) requestAnimationFrame(loop);
  });

  resize();
  if (!reduce) requestAnimationFrame(loop);
})();
</script>
</body>
</html>
