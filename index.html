<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Azure Flow</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            overflow: hidden;
            background:
                radial-gradient(circle at 20% 18%, rgba(52, 94, 138, 0.22) 0%, rgba(5, 8, 16, 0) 36%),
                radial-gradient(circle at 76% 24%, rgba(44, 86, 132, 0.18) 0%, rgba(3, 6, 12, 0) 40%),
                linear-gradient(140deg, #05070d 0%, #08101d 32%, #0f1b2f 68%, #111f36 100%);
            cursor: none;
            color: #cfd8f0;
        }

        canvas {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            display: block;
        }
    </style>
</head>
<body>
<canvas id="neuralCanvas"></canvas>

<script>
const canvas = document.getElementById('neuralCanvas');
const ctx = canvas.getContext('2d');
let width, height, dpr;

const nodes = [];
const links = [];
const pulses = [];
const embers = [];
let pointer = { x: 0, y: 0, force: 0 };

const palette = ['#9ac6ff', '#7aa8e8', '#5f89d4', '#4b6fb8'];

function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    width = canvas.width = window.innerWidth * dpr;
    height = canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    initScene();
    pointer.x = width / 2;
    pointer.y = height / 2;
}

function initScene() {
    nodes.length = 0;
    links.length = 0;
    pulses.length = 0;
    embers.length = 0;

    const nodeCount = Math.max(90, Math.floor((width * height) / (170 * 170)));
    const margin = 0.07;

    for (let i = 0; i < nodeCount; i++) {
        const xNorm = margin + Math.random() * (1 - margin * 2);
        const yNorm = margin + Math.random() * (1 - margin * 2);

        nodes.push({
            x: xNorm * width,
            y: yNorm * height,
            radius: (Math.random() * 3 + 3.5) * dpr,
            color: palette[Math.floor(Math.random() * palette.length)],
            pulsePhase: Math.random() * Math.PI * 2,
            energy: Math.random() * 0.3 + 0.7,
            angle: Math.random() * Math.PI * 2,
            speed: (Math.random() * 0.035 + 0.015) * dpr,
            turnRate: (Math.random() * 0.001 + 0.0003)
        });
    }

    nodes.forEach((node, index) => {
        const nearest = nodes
            .map((other, i) => ({ i, dist: index === i ? Infinity : distance(node, other) }))
            .sort((a, b) => a.dist - b.dist)
            .slice(0, 5);

        nearest.forEach(({ i }) => {
            if (!links.find(l => (l.a === index && l.b === i) || (l.a === i && l.b === index))) {
                links.push({
                    a: index,
                    b: i,
                    energy: Math.random() * 0.3 + 0.5,
                    thickness: Math.random() * 0.7 + 0.35
                });
            }
        });
    });

    links.forEach(link => {
        pulses.push({
            link,
            progress: Math.random(),
            speed: Math.random() * 0.16 + 0.08,
            glow: Math.random() * 0.25 + 0.35
        });
    });

    const emberCount = Math.floor((width + height) / 32);
    for (let i = 0; i < emberCount; i++) {
        embers.push({
            x: Math.random() * width,
            y: Math.random() * height,
            vx: (Math.random() - 0.5) * 0.05 * dpr,
            vy: (Math.random() - 0.5) * 0.05 * dpr,
            life: Math.random() * 2000 + 1500,
            maxLife: Math.random() * 2000 + 1500,
            size: Math.random() * 0.6 + 0.25,
            color: palette[Math.floor(Math.random() * palette.length)]
        });
    }
}

function distance(a, b) {
    const dx = a.x - b.x;
    const dy = a.y - b.y;
    return Math.sqrt(dx * dx + dy * dy);
}

function updateNodes(delta) {
    const borderX = width * 0.05;
    const borderY = height * 0.05;
    nodes.forEach(node => {
        node.angle += (Math.random() - 0.5) * node.turnRate * delta;
        const velocity = node.speed * delta * 0.08;
        node.x += Math.cos(node.angle) * velocity;
        node.y += Math.sin(node.angle) * velocity;

        if (node.x < borderX) {
            node.x = borderX;
            node.angle = Math.PI - node.angle;
        } else if (node.x > width - borderX) {
            node.x = width - borderX;
            node.angle = Math.PI - node.angle;
        }

        if (node.y < borderY) {
            node.y = borderY;
            node.angle = -node.angle;
        } else if (node.y > height - borderY) {
            node.y = height - borderY;
            node.angle = -node.angle;
        }
    });
}

function drawBackground() {
    ctx.fillStyle = 'rgba(7, 10, 20, 0.35)';
    ctx.fillRect(0, 0, width, height);
}

function drawLinks() {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    links.forEach(link => {
        const a = nodes[link.a];
        const b = nodes[link.b];
        const grad = ctx.createLinearGradient(a.x, a.y, b.x, b.y);
        grad.addColorStop(0, hexToRgba(a.color, 0.05));
        grad.addColorStop(0.5, 'rgba(132, 170, 220, 0.14)');
        grad.addColorStop(1, hexToRgba(b.color, 0.05));

        ctx.strokeStyle = grad;
        ctx.lineWidth = link.thickness * dpr;
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
    });
    ctx.restore();
}

function drawPulses(delta) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    pulses.forEach(pulse => {
        pulse.progress += pulse.speed * delta * 0.00012;
        if (pulse.progress > 1) pulse.progress -= 1;

        const a = nodes[pulse.link.a];
        const b = nodes[pulse.link.b];
        const x = a.x + (b.x - a.x) * pulse.progress;
        const y = a.y + (b.y - a.y) * pulse.progress;
        const size = (4 + pulse.link.thickness * 5) * dpr * pulse.glow;

        const gradient = ctx.createRadialGradient(x, y, 0, x, y, size * 2);
        gradient.addColorStop(0, 'rgba(132, 177, 228, 0.45)');
        gradient.addColorStop(0.5, 'rgba(92, 134, 205, 0.2)');
        gradient.addColorStop(1, 'rgba(0,0,0,0)');

        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(x, y, size * 2, 0, Math.PI * 2);
        ctx.fill();
    });
    ctx.restore();
}

function drawNodes(time) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    nodes.forEach(node => {
        const pulse = Math.sin(time * 0.9 + node.pulsePhase) * 0.5 + 0.5;
        const radius = node.radius * (0.82 + pulse * 0.16);

        ctx.fillStyle = hexToRgba(node.color, 0.2);
        ctx.beginPath();
        ctx.arc(node.x, node.y, radius * 2.1, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = hexToRgba('#e5efff', 0.55);
        ctx.beginPath();
        ctx.arc(node.x, node.y, radius * 0.45, 0, Math.PI * 2);
        ctx.fill();
    });
    ctx.restore();
}

function updateEmbers(delta) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    embers.forEach(ember => {
        ember.x += ember.vx * delta * 0.45;
        ember.y += ember.vy * delta * 0.45;
        ember.life += delta;

        if (ember.x < 0) ember.x = width;
        if (ember.x > width) ember.x = 0;
        if (ember.y < 0) ember.y = height;
        if (ember.y > height) ember.y = 0;

        if (ember.life > ember.maxLife) {
            ember.life = 0;
            ember.size = Math.random() * 0.6 + 0.25;
            ember.vx = (Math.random() - 0.5) * 0.05 * dpr;
            ember.vy = (Math.random() - 0.5) * 0.05 * dpr;
        }

        const alpha = 1 - ember.life / ember.maxLife;
        ctx.fillStyle = hexToRgba(ember.color, alpha * 0.22);
        ctx.beginPath();
        ctx.arc(ember.x, ember.y, ember.size * dpr, 0, Math.PI * 2);
        ctx.fill();
    });
    ctx.restore();
}

function drawPointer() {
    pointer.force *= 0.85;
    const radius = 20 * dpr + pointer.force * 14 * dpr;

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const gradient = ctx.createRadialGradient(pointer.x, pointer.y, 0, pointer.x, pointer.y, radius * 2.2);
    gradient.addColorStop(0, 'rgba(134, 177, 228, 0.22)');
    gradient.addColorStop(0.6, 'rgba(88, 127, 189, 0.12)');
    gradient.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(pointer.x, pointer.y, radius * 2.2, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = 'rgba(204, 226, 255, 0.3)';
    ctx.beginPath();
    ctx.arc(pointer.x, pointer.y, radius * 0.42, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
}

function hexToRgba(hex, alpha) {
    const sanitized = hex.replace('#', '');
    const bigint = parseInt(sanitized, 16);
    const r = (bigint >> 16) & 255;
    const g = (bigint >> 8) & 255;
    const b = bigint & 255;
    return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

let lastTime = performance.now();
function animate(time) {
    const delta = Math.min(time - lastTime, 32);
    lastTime = time;

    updateNodes(delta);
    drawBackground();
    drawLinks();
    drawPulses(delta);
    drawNodes(time * 0.0012);
    updateEmbers(delta);
    drawPointer();

    requestAnimationFrame(animate);
}

window.addEventListener('mousemove', event => {
    pointer.x = event.clientX * dpr;
    pointer.y = event.clientY * dpr;
    pointer.force = 1;
});

window.addEventListener('touchmove', event => {
    const touch = event.touches[0];
    pointer.x = touch.clientX * dpr;
    pointer.y = touch.clientY * dpr;
    pointer.force = 1;
}, { passive: true });

window.addEventListener('resize', resize);

resize();
animate(lastTime);
</script>
</body>
</html>
